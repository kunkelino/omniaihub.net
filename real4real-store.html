
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRBHNCO Store</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:Arial,sans-serif;padding-bottom:80px}
header{padding:15px;text-align:center;border-bottom:1px solid #333}
header img{max-height:65px;max-width:90%;object-fit:contain}
main{display:grid;grid-template-columns:2fr 1fr;gap:18px;padding:18px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.product{background:#111;border:1px solid #333;border-radius:12px;padding:14px;min-width:0}
.product h2{color:#e4c56a;margin-bottom:12px;font-size:19px}
.preview{width:100%;height:280px;object-fit:contain;background:#fff;border-radius:8px}
.colors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0}
.color{background:#222;color:#fff;border:2px solid transparent;border-radius:6px;padding:4px;font-size:11px;cursor:pointer}
.color.active{border-color:#e4c56a}
.color img{width:100%;height:65px;object-fit:contain;background:#fff}
.color span{display:block;padding:4px 0}
.options{display:flex;gap:8px;margin:10px 0}
select,input{background:#222;color:#fff;border:1px solid #555;border-radius:6px;padding:9px;min-width:0}
input{width:75px}
.add{width:100%;padding:12px;background:#e4c56a;color:#000;border:0;border-radius:7px;font-weight:bold;cursor:pointer}
.video{position:sticky;top:0;height:80vh}
.video video{width:100%;height:100%;object-fit:cover}
.cart{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #444;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:5}
#cartItems{font-size:12px;color:#ddd;overflow-wrap:anywhere}
#checkoutBtn{background:#e4c56a;color:#000;border:0;border-radius:7px;padding:12px 20px;font-weight:bold;cursor:pointer}
#checkoutBtn:disabled{opacity:.6}
#notice{display:none;padding:15px;margin:15px;border:1px solid #e4c56a;color:#e4c56a}
@media(max-width:800px){
 main{display:flex;flex-direction:column;padding:10px}
 .video{order:-1;position:relative;height:35vh}
 .products{grid-template-columns:1fr}
 .preview{height:300px}
 .cart{padding:10px}
 #checkoutBtn{padding:11px;font-size:12px}
}
</style>
</head>

<body>
<header>
  <img src="logo.png" alt="MRBHNCO" onerror="this.style.display='none'">
</header>

<div id="notice" role="status"></div>

<main>
  <section class="products" id="products"></section>
  <aside class="video">
    <video autoplay muted loop playsinline>
      <source src="home-video.mp4" type="video/mp4">
    </video>
  </aside>
</main>

<div class="cart">
  <div id="cartItems">Cart empty</div>
  <button id="checkoutBtn">Checkout — $0.00</button>
</div>

<script>
/*
  PRODUCT IMAGE FILES:
  Keep your existing image files in the same directory as this HTML.
  If a filename differs, update it in the product definitions below.
*/

const products = [
  {
    id: "bikini",
    name: "Bikini",
    price: 45,
    images: [
      ["Black / Yellow","bikini-black-yellow.jpg"],
      ["Black / White","bikini-black-white.jpg"],
      ["Black / Red","bikini-black-red.jpg"],
      ["Black / Green","bikini-black-green.jpg"],
      ["Black / Blue","bikini-black-blue.jpg"],
      ["Black / Gray","bikini-black-gray.jpg"]
    ],
    sizes: ["XS","S","M","L","XL"]
  },
  {
    id: "track2",
    name: "Tracksuit",
    price: 85,
    images: [
      ["Black / Yellow","track2-1.jpg"],
      ["Black / White","track2-2.jpg"],
      ["Black / Red","track2-3.jpg"],
      ["Black / Green","track2-4.jpg"],
      ["Black / Blue","track2-5.jpg"],
      ["Black / Gray","track2-6.jpg"]
    ],
    sizes: ["S","M","L","XL","2XL"]
  },
  {
    id: "track3",
    name: "Tracksuit",
    price: 85,
    images: [
      ["Black / Yellow","track3-1.jpg"],
      ["Black / White","track3-2.jpg"],
      ["Black / Red","track3-3.jpg"],
      ["Black / Green","track3-4.jpg"],
      ["Black / Blue","track3-5.jpg"],
      ["Black / Gray","track3-6.jpg"]
    ],
    sizes: ["S","M","L","XL","2XL"]
  },
  {
    id: "track4",
    name: "Tracksuit",
    price: 85,
    images: [
      ["Black / Yellow","track4-1.jpg"],
      ["Black / White","track4-2.jpg"],
      ["Black / Red","track4-3.jpg"],
      ["Black / Green","track4-4.jpg"],
      ["Black / Blue","track4-5.jpg"],
      ["Black / Gray","track4-6.jpg"]
    ],
    sizes: ["S","M","L","XL","2XL"]
  },
  {
    id: "track5",
    name: "Tracksuit",
    price: 85,
    images: [
      ["Black / Yellow","track5-1.jpg"],
      ["Black / White","track5-2.jpg"],
      ["Black / Red","track5-3.jpg"],
      ["Black / Green","track5-4.jpg"],
      ["Black / Blue","track5-5.jpg"],
      ["Black / Gray","track5-6.jpg"]
    ],
    sizes: ["S","M","L","XL","2XL"]
  },
  {
    id: "track6",
    name: "Tracksuit",
    price: 85,
    images: [
      ["Black / Yellow","1.jpg"],
      ["Black / White","2.jpg"],
      ["Black / Red","3.jpg"],
      ["Black / Green","4.jpg"],
      ["Black / Blue","5.jpg"],
      ["Black / Gray","6.jpg"]
    ],
    sizes: ["S","M","L","XL","2XL"]
  },
  {
    id: "track7",
    name: "Tracksuit",
    price: 85,
    images: [
      ["Gray / Yellow","7.jpg"],
      ["Gray / White","8.jpg"],
      ["Gray / Red","9.jpg"],
      ["Gray / Green","10.jpg"],
      ["Gray / Blue","11.jpg"],
      ["Gray / Gray","12.jpg"]
    ],
    sizes: ["S","M","L","XL","2XL"]
  }
];

const cart = [];
const productsContainer = document.getElementById("products");

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[character]);
}

function renderProducts() {
  productsContainer.innerHTML = products.map(product => `
    <article class="product" data-product="${product.id}">
      <h2>${escapeHTML(product.name)}</h2>

      <img
        class="preview"
        id="preview-${product.id}"
        src="${product.images[0][1]}"
        alt="${escapeHTML(product.name)}"
      >

      <div class="colors">
        ${product.images.map((image,index) => `
          <button
            type="button"
            class="color ${index === 0 ? "active" : ""}"
            data-product="${product.id}"
            data-index="${index}"
          >
            <img src="${image[1]}" alt="">
            <span>${escapeHTML(image[0])}</span>
          </button>
        `).join("")}
      </div>

      <div class="options">
        <select class="size" aria-label="Choose size">
          ${product.sizes.map(size =>
            `<option value="${size}">${size}</option>`
          ).join("")}
        </select>

        <input
          class="quantity"
          type="number"
          min="1"
          max="10"
          value="1"
          aria-label="Quantity"
        >
      </div>

      <button class="add" type="button" data-add="${product.id}">
        Add to Cart — $${product.price.toFixed(2)}
      </button>
    </article>
  `).join("");
}

function updateCart() {
  const total = cart.reduce(
    (sum,item) => sum + item.price * item.qty,
    0
  );

  document.getElementById("cartItems").innerHTML =
    cart.length
      ? cart.map(item =>
          `${escapeHTML(item.name)} — ${escapeHTML(item.color)} — Size ${escapeHTML(item.size)} × ${item.qty}`
        ).join("<br>")
      : "Cart empty";

  document.getElementById("checkoutBtn").textContent =
    `Checkout — $${total.toFixed(2)}`;
}

productsContainer.addEventListener("click", event => {
  const colorButton = event.target.closest(".color");

  if (colorButton) {
    const product = products.find(
      item => item.id === colorButton.dataset.product
    );
    const index = Number(colorButton.dataset.index);

    document.getElementById(`preview-${product.id}`).src =
      product.images[index][1];

    colorButton.parentElement.querySelectorAll(".color")
      .forEach(button => button.classList.remove("active"));

    colorButton.classList.add("active");
    return;
  }

  const addButton = event.target.closest("[data-add]");
  if (!addButton) return;

  const product = products.find(
    item => item.id === addButton.dataset.add
  );
  const article = addButton.closest(".product");
  const qty = Number(article.querySelector(".quantity").value);
  const size = article.querySelector(".size").value;
  const selectedColor = article.querySelector(".color.active");
  const colorIndex = selectedColor
    ? Number(selectedColor.dataset.index)
    : 0;
  const color = product.images[colorIndex][0];

  if (!Number.isInteger(qty) || qty < 1 || qty > 10) {
    alert("Please select a quantity from 1 to 10.");
    return;
  }

  cart.push({
    id: product.id,
    name: product.name,
    price: product.price,
    qty,
    size,
    color
  });

  updateCart();

  const original = `Add to Cart — $${product.price.toFixed(2)}`;
  addButton.textContent = "Added!";
  setTimeout(() => { addButton.textContent = original; }, 800);
});

document.getElementById("checkoutBtn").addEventListener("click", async () => {
  if (!cart.length) {
    alert("Your cart is empty.");
    return;
  }

  const button = document.getElementById("checkoutBtn");
  const previousText = button.textContent;

  button.disabled = true;
  button.textContent = "Connecting to Stripe...";

  try {
    const response = await fetch("/api/checkout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        items: cart.map(item => ({
          id: item.id,
          qty: item.qty,
          size: item.size,
          color: item.color
        }))
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Could not start checkout.");
    }

    if (!result.url) {
      throw new Error("Stripe did not return a checkout link.");
    }

    window.location.href = result.url;
  } catch (error) {
    alert(error.message || "Checkout failed. Please try again.");
    button.disabled = false;
    button.textContent = previousText;
  }
});

const checkoutStatus = new URLSearchParams(location.search).get("checkout");
const notice = document.getElementById("notice");

if (checkoutStatus === "success") {
  notice.textContent =
    "You've returned from Stripe checkout. Confirm the payment in Stripe before treating an order as paid.";
  notice.style.display = "block";
} else if (checkoutStatus === "cancelled") {
  notice.textContent =
    "Checkout was cancelled. You can return to your cart and try again.";
  notice.style.display = "block";
}

renderProducts();
updateCart();
</script>
</body>
</html>
