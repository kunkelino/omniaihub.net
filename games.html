<html lang="en">
<head>
  <meta charset="utf-8">

    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"

  <title>They're Watching You</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: #050505;
      color: #f4efe6;
      font-family: Georgia, "Times New Roman", serif;

    .app {
      height: 100dvh;

      text-align: center;
      padding: 12px 16px 0;
    }

    .kicker {
      letter-spacing: .42em;

    h1 {

      position: relative;
      flex: 1;
      margin: 10px 8px 42px;
      border-radius: 18px;
      overflow: hidden;
      background: #111;

      box-shadow: 0 20px 60px #000;
    }

    /*
      All three videos occupy the exact same space.
      Opacity is used to switch between them instead of
      changing the source of a single video.
    */
    .video-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #111;

      opacity: 0;
      pointer-events: none;

      transition: opacity 0s linear;
    }

    .video-layer.active {
      opacity: 1;
    }

    .shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,.18),
          transparent 12%,
          transparent 78%,
          rgba(0,0,0,.28)
        );
      z-index: 4;

      position: absolute;

      transform: translate(-50%,-50%);

    }

</head>

<body>

<div class="app">

  <header class="top">
    <div class="kicker">OMNIAIHUB</div>

    <h1>THEY'RE WATCHING YOU</h1>

    <div class="sub">
      They're talking. Point somewhere.
    </div>
  </header>

  <section class="stage" id="stage">

    <!--
      All three videos are loaded at the same time.
      Only one is visible at any given moment.
    -->

    <video
      id="video-loop"
      class="video-layer active"
      src="loop.mp4"
      playsinline
      muted
      autoplay
      loop
      preload="auto"
    ></video>

    <video
      id="video-curtain"
      class="video-layer"
      src="curtain.mp4"
      playsinline
      preload="auto"
    ></video>

    <video
      id="video-up"
      class="video-layer"
      src="up.mp4"
      playsinline
      preload="auto"
    ></video>

    <div class="shade"></div>

    <a
      class="back"
      href="../games.html"
    >
      Games
    </a>

    <div class="finger" id="finger"></div>

  </section>

</div>

<script>
  const stage = document.getElementById("stage");
  const finger = document.getElementById("finger");

  const videos = {
    loop: document.getElementById("video-loop"),
    curtain: document.getElementById("video-curtain"),
    up: document.getElementById("video-up")
  };

  let shown = "loop";


  /*
    Prepare all videos immediately.

    The browser is told to preload every video so that
    switching between them doesn't require changing
    the source of a video element.
  */
  Object.values(videos).forEach(video => {
    video.preload = "auto";

    /*
      Force the browser to begin loading the video.
    */
    video.load();
  });


  /*
    Keep the loop video playing continuously.
  */
  videos.loop.muted = true;
  videos.loop.loop = true;

  videos.loop.play().catch(() => {});


  /*
    Switch videos instantly by changing opacity.

    There is NO src change here.
    There is NO replacing of the video element.
  */
  function play(which) {

    const target = videos[which];

    if (!target) return;

    if (shown === which) {
      if (target.paused) {
        target.play().catch(() => {});
      }
      return;
    }

    const previous = videos[shown];

    /*
      Make sure the target starts from the beginning.
    */
    try {
      target.currentTime = 0;
    } catch (e) {}

    /*
      Preserve the original behavior:
      loop is muted, directional videos can have audio.
    */
    if (which === "loop") {
      target.muted = true;
      target.loop = true;
    } else {
      target.muted = false;
      target.loop = false;
    }

    /*
      Start the new video BEFORE making it visible.
      Because the video is already preloaded, this should
      eliminate the black/loading transition.
    */
    const startPromise = target.play();

    if (startPromise) {
      startPromise
        .catch(() => {})
        .finally(() => {

          /*
            Instantly show the new video.
          */
          target.classList.add("active");

          /*
            Immediately hide the previous video.
          */
          if (previous) {
            previous.classList.remove("active");
          }

          shown = which;
        });
    } else {

      target.classList.add("active");

      if (previous) {
        previous.classList.remove("active");
      }

      shown = which;
    }
  }


  /*
    When either directional video finishes,
    immediately return to the looping video.
  */
  videos.curtain.addEventListener("ended", () => {
    finger.style.opacity = "0";
    play("loop");
  });

  videos.up.addEventListener("ended", () => {
    finger.style.opacity = "0";
    play("loop");
  });


  /*
    Determine which video the user is pointing toward.
  */
  function aim(x, y) {

    const r = stage.getBoundingClientRect();

    const nx = Math.max(
      0,
      Math.min(1, (x - r.left) / r.width)
    );

    const ny = Math.max(
      0,
      Math.min(1, (y - r.top) / r.height)
    );

    /*
      Show the finger indicator.
    */
    finger.style.opacity = "1";
    finger.style.left = (nx * 100) + "%";
    finger.style.top = (ny * 100) + "%";


    /*
      Right side = curtain
      Left side = looking up
    */
    if (nx >= 0.5) {
      play("curtain");
    } else {
      play("up");
    }
  }


  /*
    Mouse / touch / pointer support.
  */
  stage.addEventListener(
    "pointerdown",
    e => {
      stage.setPointerCapture?.(e.pointerId);
      aim(e.clientX, e.clientY);
    },
    { passive: false }
  );


  stage.addEventListener(
    "pointermove",
    e => {
      if (e.buttons || e.pointerType === "touch") {
        aim(e.clientX, e.clientY);
      }
    },
    { passive: false }
  );


  stage.addEventListener(
    "touchmove",
    e => e.preventDefault(),
    { passive: false }
  );


  /*
    Start on the looping video.
  */
  play("loop");
</script>

</body>
</html>
