<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>They're Watching You</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#050505;color:#f4efe6;font-family:Georgia,"Times New Roman",serif;height:100%}
body{min-height:100dvh;overflow:hidden;touch-action:none}
.app{height:100dvh;display:flex;flex-direction:column}
.top{text-align:center;padding:12px 16px 0}
.kicker{letter-spacing:.42em;font-size:10px;font-family:Arial,sans-serif;opacity:.55}
h1{margin:6px 0 0;font-weight:500;letter-spacing:.08em;font-size:clamp(22px,6.2vw,40px)}
.sub{font-family:Arial,sans-serif;font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.72;min-height:18px;margin-top:6px}
.stage{position:relative;flex:1;margin:10px 8px 42px;border-radius:18px;overflow:hidden;background:#111;touch-action:none;box-shadow:0 20px 60px #000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.look{opacity:0}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.22),transparent 14%,transparent 74%,rgba(0,0,0,.35))}
.finger{position:absolute;z-index:6;width:30px;height:30px;border:1.5px solid rgba(255,255,255,.9);border-radius:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;box-shadow:0 0 0 8px rgba(255,255,255,.08)}
.back{position:absolute;z-index:7;left:12px;top:12px;color:#fff;text-decoration:none;font-family:Arial,sans-serif;font-size:12px;letter-spacing:.08em;background:rgba(0,0,0,.45);padding:7px 10px;border-radius:999px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="kicker">OMNIAIHUB</div>
    <h1>THEY'RE WATCHING YOU</h1>
    <div class="sub" id="line">They're talking. Point somewhere.</div>
  </header>
  <section class="stage" id="stage">
    <video id="talk" src="room/talk.mp4" autoplay muted loop playsinline></video>
    <video class="look" id="left" src="room/look-left.mp4" muted playsinline></video>
    <video class="look" id="right" src="room/look-right.mp4" muted playsinline></video>
    <video class="look" id="down" src="room/look-down.mp4" muted playsinline></video>
    <video class="look" id="stand" src="room/stand.mp4" muted playsinline></video>
    <div class="shade"></div>
    <a class="back" href="../games.html">Games</a>
    <div class="finger" id="finger"></div>
  </section>
</div>
<script src="/copyright.js"></script>
<script>
const stage = document.getElementById("stage");
const line = document.getElementById("line");
const finger = document.getElementById("finger");
const talk = document.getElementById("talk");
const clips = {
  left: document.getElementById("left"),
  right: document.getElementById("right"),
  down: document.getElementById("down"),
  stand: document.getElementById("stand")
};
let has = false, shown = null;
function play(v){ try { v.currentTime = 0; } catch(e){} v.play().catch(()=>{}); }
function aim(x,y){
  const r = stage.getBoundingClientRect();
  const nx = Math.max(0, Math.min(1, (x-r.left)/r.width));
  const ny = Math.max(0, Math.min(1, (y-r.top)/r.height));
  has = true;
  finger.style.opacity = "1";
  finger.style.left = (nx*100)+"%";
  finger.style.top = (ny*100)+"%";
  const want = (nx < 0.32 && ny < 0.42) ? "stand" : (ny > 0.62 ? "down" : (nx < 0.46 ? "left" : "right"));
  if (shown !== want){
    Object.values(clips).forEach(v => { v.style.opacity = "0"; v.pause(); });
    shown = want;
    play(clips[want]);
    clips[want].style.opacity = "1";
    line.textContent = want === "stand" ? "He's getting up to look." : "What is that?";
  }
}
stage.addEventListener("pointerdown", e => { stage.setPointerCapture?.(e.pointerId); talk.play().catch(()=>{}); aim(e.clientX,e.clientY); }, {passive:false});
stage.addEventListener("pointermove", e => { if (e.buttons || e.pointerType === "touch" || has) aim(e.clientX,e.clientY); }, {passive:false});
stage.addEventListener("pointerup", () => {
  has = false; shown = null;
  finger.style.opacity = "0";
  Object.values(clips).forEach(v => { v.style.opacity = "0"; });
  line.textContent = "They're talking. Point somewhere.";
});
stage.addEventListener("touchmove", e => e.preventDefault(), {passive:false});
talk.play().catch(()=>{});
</script>
</body>
</html>
