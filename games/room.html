<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>They're Watching You</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#050505;color:#f4efe6;font-family:Georgia,"Times New Roman",serif;height:100%}
body{min-height:100dvh;min-height:100svh;overflow:hidden;touch-action:none}
.app{height:100dvh;height:100svh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.top{text-align:center;padding:10px 16px 0;flex:0 0 auto}
.kicker{letter-spacing:.42em;font-size:10px;font-family:Arial,sans-serif;opacity:.55}
h1{margin:4px 0 0;font-weight:500;letter-spacing:.08em;font-size:clamp(18px,4.6vw,36px)}
.sub{font-family:Arial,sans-serif;font-size:clamp(11px,2.6vw,13px);letter-spacing:.14em;text-transform:uppercase;opacity:.72;min-height:16px;margin-top:4px}
.stage{position:relative;flex:0 0 auto;aspect-ratio:9/16;height:min(78dvh,860px);width:auto;max-width:calc(100% - 24px);margin:10px auto 16px;border-radius:18px;overflow:hidden;background:#111;touch-action:none;box-shadow:0 20px 60px #000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center 64%;background:#111;opacity:0;pointer-events:none}
video.on{opacity:1}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.12),transparent 10%,transparent 82%,rgba(0,0,0,.22))}
@media (max-width:720px),(orientation:portrait){
  .top{padding:8px 12px 0}
  .kicker{font-size:9px}
  .stage{height:min(74dvh,760px);max-width:calc(100% - 16px);margin:8px auto 12px;border-radius:0}
}
@media (max-height:520px){
  .kicker,h1{display:none}
  .top{padding:4px 10px 0}
  .stage{height:min(86dvh,520px);margin:4px auto}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="kicker">OMNIAIHUB</div>
    <h1>THEY'RE WATCHING YOU</h1>
  </header>
  <section class="stage" id="stage">
    <video id="loop" class="on" src="room/loop.mp4" playsinline autoplay loop preload="auto"></video>
    <video id="left" src="room/screenright.mp4" playsinline preload="auto"></video>
    <video id="right" src="room/screenleft.mp4" playsinline preload="auto"></video>
    <video id="center" src="room/screencenter.mp4" playsinline preload="auto"></video>
    <video id="down" src="room/screendown.mp4" playsinline preload="auto"></video>
    <video id="up" src="room/screenup.mp4" playsinline preload="auto"></video>
    <div class="shade"></div>
  </section>
</div>
<script src="/copyright.js"></script>
<script>
const stage = document.getElementById("stage");
const clips = {
  loop: document.getElementById("loop"),
  left: document.getElementById("left"),
  right: document.getElementById("right"),
  center: document.getElementById("center"),
  down: document.getElementById("down"),
  up: document.getElementById("up")
};
let shown = "loop";
let busy = false;
function audible(){
  Object.values(clips).forEach(v => { v.muted = false; v.volume = 1; });
}
function warm(v){
  const arm = () => {
    if (v.readyState >= 2 && v.currentTime === 0) {
      try { v.currentTime = 0.04; } catch (e) {}
    }
  };
  v.addEventListener("loadeddata", arm);
  if (v.readyState >= 2) arm();
}
Object.values(clips).forEach(warm);
function show(which){
  if (shown === which) return;
  const next = clips[which];
  const prev = clips[shown];
  audible();
  if (which !== "loop") {
    try { next.currentTime = 0.04; } catch (e) {}
  }
  next.play().then(() => {
    next.classList.add("on");
    if (prev !== next) prev.classList.remove("on");
    shown = which;
    busy = which !== "loop";
    if (prev !== next) prev.pause();
  }).catch(() => {
    clips.loop.classList.add("on");
    clips.loop.play().catch(()=>{});
    shown = "loop";
    busy = false;
  });
}
Object.values(clips).forEach(v => v.addEventListener("ended", () => {
  if (shown !== "loop" && clips[shown] === v) show("loop");
}));
function zone(nx, ny){
  if (ny > 0.62) return "down";
  if (ny < 0.28) return "up";
  if (nx > 0.36 && nx < 0.64) return "center";
  if (nx < 0.5) return "left";
  return "right";
}
stage.addEventListener("pointerdown", e => {
  audible();
  if (busy) return;
  const r = stage.getBoundingClientRect();
  show(zone((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height));
}, {passive:true});
function startTalking(){
  const v = clips.loop;
  v.muted = false;
  v.play().catch(() => {
    v.muted = true;
    v.play().then(() => { v.muted = false; }).catch(()=>{});
  });
}
startTalking();
document.addEventListener("pointerdown", () => { audible(); if (clips.loop.paused && shown === "loop") startTalking(); }, {once:true});
</script>
</body>
</html>
