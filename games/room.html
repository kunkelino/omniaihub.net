<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>They're Watching You</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#050505;color:#f4efe6;font-family:Georgia,"Times New Roman",serif;height:100%}
body{min-height:100dvh;overflow:hidden;touch-action:none}
.app{height:100dvh;display:flex;flex-direction:column}
.top{text-align:center;padding:12px 16px 0}
.kicker{letter-spacing:.42em;font-size:10px;font-family:Arial,sans-serif;opacity:.55}
h1{margin:6px 0 0;font-weight:500;letter-spacing:.08em;font-size:clamp(22px,6.2vw,40px)}
.sub{font-family:Arial,sans-serif;font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.72;min-height:18px;margin-top:6px}
.stage{position:relative;flex:1;margin:10px 8px 42px;border-radius:18px;overflow:hidden;background:#111;touch-action:none;box-shadow:0 20px 60px #000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#111;opacity:0;pointer-events:none}
video.on{opacity:1}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.12),transparent 10%,transparent 82%,rgba(0,0,0,.22))}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="kicker">OMNIAIHUB</div>
    <h1>THEY'RE WATCHING YOU</h1>
    <div class="sub" id="line">They're talking. Point somewhere.</div>
  </header>
  <section class="stage" id="stage">
    <video id="loop" class="on" src="room/loop.mp4" playsinline autoplay loop preload="auto"></video>
    <video id="left" src="room/screenleft.mp4" playsinline preload="auto"></video>
    <video id="right" src="room/screenright.mp4" playsinline preload="auto"></video>
    <video id="center" src="room/screencenter.mp4" playsinline preload="auto"></video>
    <video id="down" src="room/screendown.mp4" playsinline preload="auto"></video>
    <video id="up" src="room/screenup.mp4" playsinline preload="auto"></video>
    <div class="shade"></div>
  </section>
</div>
<script src="/copyright.js"></script>
<script>
const stage = document.getElementById("stage");
const line = document.getElementById("line");
const clips = {
  loop: document.getElementById("loop"),
  left: document.getElementById("left"),
  right: document.getElementById("right"),
  center: document.getElementById("center"),
  down: document.getElementById("down"),
  up: document.getElementById("up")
};
const labels = {
  loop: "They're talking.",
  left: "Screen left.",
  right: "Screen right.",
  center: "Screen center.",
  down: "Looking down.",
  up: "Looking up."
};
let shown = "loop";
let busy = false;
function audible(v){ v.muted = false; v.volume = 1; }
Object.values(clips).forEach(audible);
function show(which){
  if (shown === which) return;
  const next = clips[which];
  const prev = clips[shown];
  audible(next);
  if (which !== "loop") next.currentTime = 0;
  const start = next.play();
  next.classList.add("on");
  prev.classList.remove("on");
  prev.pause();
  if (start) start.catch(()=>{});
  shown = which;
  line.textContent = labels[which];
  busy = which !== "loop";
}
Object.values(clips).forEach(v => v.addEventListener("ended", () => {
  if (shown !== "loop" && clips[shown] === v) show("loop");
}));
function zone(nx, ny){
  if (nx > 0.40 && nx < 0.60 && ny > 0.30 && ny < 0.70) return "center";
  if (nx < 0.5) return "left";
  return "right";
}
stage.addEventListener("pointerdown", e => {
  Object.values(clips).forEach(audible);
  if (busy) return;
  const r = stage.getBoundingClientRect();
  const nx = (e.clientX - r.left) / r.width;
  const ny = (e.clientY - r.top) / r.height;
  const which = zone(nx, ny);
  if (which) show(which);
}, {passive:true});
clips.loop.play().catch(() => {
  clips.loop.muted = true;
  clips.loop.play().then(() => { clips.loop.muted = false; }).catch(()=>{});
});
</script>
</body>
</html>
