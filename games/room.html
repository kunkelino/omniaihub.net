<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>They're Watching You</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#050505;color:#f4efe6;font-family:Georgia,"Times New Roman",serif;height:100%}
body{min-height:100dvh;overflow:hidden;touch-action:none}
.app{height:100dvh;display:flex;flex-direction:column}
.top{text-align:center;padding:12px 16px 0;position:relative;z-index:4}
.kicker{letter-spacing:.42em;font-size:10px;font-family:Arial,sans-serif;opacity:.55}
h1{margin:6px 0 0;font-weight:500;letter-spacing:.08em;font-size:clamp(22px,6.2vw,40px)}
.sub{font-family:Arial,sans-serif;font-size:13px;letter-spacing:.18em;text-transform:uppercase;opacity:.72;min-height:18px;margin-top:6px}
.stage{position:relative;flex:1;margin:10px 8px 42px;border-radius:18px;overflow:hidden;background:#111;touch-action:none;box-shadow:0 20px 60px #000}
.plate{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;pointer-events:none;will-change:opacity,transform}
.talk{z-index:1}
.look{z-index:2;opacity:0}
.shade{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 14%,transparent 70%,rgba(0,0,0,.45))}
.finger{position:absolute;z-index:5;width:34px;height:34px;border:1.5px solid rgba(255,255,255,.9);border-radius:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;box-shadow:0 0 0 8px rgba(255,255,255,.08)}
.back{position:absolute;z-index:6;left:12px;top:12px;color:#fff;text-decoration:none;font-family:Arial,sans-serif;font-size:12px;letter-spacing:.08em;background:rgba(0,0,0,.45);padding:7px 10px;border-radius:999px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="kicker">OMNIAIHUB</div>
    <h1>THEY'RE WATCHING YOU</h1>
    <div class="sub" id="line">Move your finger.</div>
  </header>
  <section class="stage" id="stage">
    <video class="plate talk" id="talk" src="room/talk.mp4" poster="room/talk.jpg" autoplay muted loop playsinline></video>
    <video class="plate look" id="look" src="room/look.mp4" poster="room/look.jpg" autoplay muted loop playsinline></video>
    <div class="shade"></div>
    <a class="back" href="../games.html">Games</a>
    <div class="finger" id="finger"></div>
  </section>
</div>
<script src="/copyright.js"></script>
<script>
const stage = document.getElementById("stage");
const line = document.getElementById("line");
const finger = document.getElementById("finger");
const talk = document.getElementById("talk");
const look = document.getElementById("look");
let px = 0.5, py = 0.55, has = false, attention = 0, tx = 0, ty = 0;
function kick(){ [talk, look].forEach(v => v.play().catch(()=>{})); }
stage.addEventListener("pointerdown", e => { stage.setPointerCapture?.(e.pointerId); aim(e.clientX, e.clientY); kick(); }, {passive:false});
stage.addEventListener("pointermove", e => { if (e.buttons || e.pointerType === "touch" || has) aim(e.clientX, e.clientY); }, {passive:false});
stage.addEventListener("pointerup", () => { has = false; });
stage.addEventListener("touchmove", e => e.preventDefault(), {passive:false});
function aim(x, y){
  const r = stage.getBoundingClientRect();
  px = Math.max(0, Math.min(1, (x - r.left) / r.width));
  py = Math.max(0, Math.min(1, (y - r.top) / r.height));
  has = true;
  finger.style.opacity = "1";
  finger.style.left = (px * 100) + "%";
  finger.style.top = (py * 100) + "%";
}
function tick(){
  attention += ((has ? 1 : 0) - attention) * (has ? 0.08 : 0.035);
  tx += ((px - 0.5) - tx) * 0.06;
  ty += ((py - 0.5) - ty) * 0.06;
  look.style.opacity = String(attention);
  const shift = "translate(" + (tx * -28) + "px," + (ty * -18) + "px) scale(1.04)";
  talk.style.transform = shift;
  look.style.transform = shift;
  line.textContent = attention < 0.35 ? "Move your finger." : "They stopped. They're looking.";
  requestAnimationFrame(tick);
}
kick();
requestAnimationFrame(tick);
</script>
</body>
</html>
