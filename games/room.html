<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>What Are You Looking At</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#050505;color:#f4efe6;font-family:Georgia,"Times New Roman",serif;height:100%}
body{min-height:100dvh;overflow:hidden;touch-action:none}
.app{min-height:100dvh;display:flex;flex-direction:column}
.top{text-align:center;padding:12px 16px 0;flex:none}
.kicker{letter-spacing:.42em;font-size:10px;font-family:Arial,sans-serif;opacity:.55}
h1{margin:6px 0 0;font-weight:500;letter-spacing:.08em;font-size:clamp(22px,6.2vw,40px)}
.stage{position:relative;flex:none;width:min(calc(100vw - 16px),1200px);aspect-ratio:16/9;margin:10px auto 42px;border-radius:18px;overflow:hidden;background:#111;touch-action:none;box-shadow:0 20px 60px #000}
.video{position:absolute;left:0;top:0;width:100%;height:100%;transform:scale(1.12);transform-origin:center top;object-fit:cover;object-position:center top;background:#111;opacity:0;pointer-events:none}
.video.visible{opacity:1}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 12%,transparent 78%,rgba(0,0,0,.28));z-index:20}
.finger{position:absolute;z-index:22;width:30px;height:30px;border:1.5px solid rgba(255,255,255,.9);border-radius:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;box-shadow:0 0 0 8px rgba(255,255,255,.08)}
@media (orientation:portrait){
.top{padding-top:8px}.kicker{font-size:8px}h1{font-size:clamp(18px,6vw,28px)}
.stage{width:min(calc(100vw - 16px),calc((100dvh - 92px) * 9 / 16));aspect-ratio:9/16;margin:8px auto 18px}
}
@media (orientation:landscape){
.stage{width:min(92vw,1280px);aspect-ratio:16/9}
.video{transform:none;transform-origin:center center;object-position:center center}
}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="kicker">OMNIAIHUB</div><h1>WHAT ARE YOU LOOKING AT</h1></header>
<section class="stage" id="stage">
  <video id="loopVideo" class="video visible" src="loop.mp4" playsinline webkit-playsinline autoplay loop preload="auto" muted></video>

  <!-- Every response clip is kept as its own video element and preloaded.
       This avoids waiting for a new video source when the screen is touched. -->
  <video id="screenLeft" class="video" src="screenright.mp4" playsinline webkit-playsinline preload="auto"></video>
  <video id="centerDown" class="video" src="centerdown.mp4" playsinline webkit-playsinline preload="auto"></video>
  <video id="centerRight" class="video" src="leftcenter.mp4" playsinline webkit-playsinline preload="auto"></video>
  <video id="curtain" class="video" src="curtain.mp4" playsinline webkit-playsinline preload="auto"></video>
  <video id="centerUp" class="video" src="up.mp4" playsinline webkit-playsinline preload="auto"></video>

  <div class="shade"></div><div class="finger" id="finger"></div>
</section>
</div>
<script>
const stage=document.getElementById("stage");
const finger=document.getElementById("finger");
const loopVideo=document.getElementById("loopVideo");

const videos={
  screenLeft:document.getElementById("screenLeft"),
  centerDown:document.getElementById("centerDown"),
  centerRight:document.getElementById("centerRight"),
  curtain:document.getElementById("curtain"),
  centerUp:document.getElementById("centerUp")
};

let mode="loop";
let loopPosition=0;
let audioUnlocked=false;
let transitionBusy=false;

const allDirectionVideos=Object.values(videos);

function unlockAudio(){
  audioUnlocked=true;
  loopVideo.muted=false;
  loopVideo.volume=1;

  allDirectionVideos.forEach(video=>{
    video.muted=false;
    video.volume=1;
  });

  loopVideo.play().catch(()=>{});
}

function preloadDirectionVideos(){
  allDirectionVideos.forEach(video=>{
    video.preload="auto";
    video.load();
  });
}

loopVideo.addEventListener("loadedmetadata",()=>{
  loopVideo.loop=true;
  loopVideo.play().catch(()=>{});
});

function hideAllDirectionVideos(){
  allDirectionVideos.forEach(video=>{
    video.classList.remove("visible");
  });
}

function showDirection(which){
  if(transitionBusy)return;

  const next=videos[which];
  if(!next)return;

  transitionBusy=true;

  loopPosition=loopVideo.currentTime||0;
  loopVideo.pause();

  const start=()=>{
    try{next.currentTime=0}catch(e){}

    next.muted=!audioUnlocked;
    next.volume=1;

    next.classList.add("visible");
    loopVideo.classList.remove("visible");

    mode=which;
    next.play().catch(()=>{});
    transitionBusy=false;
  };

  if(next.readyState>=2){
    start();
  }else{
    next.addEventListener("canplay",start,{once:true});
    next.load();
  }
}

function returnToLoop(){
  if(mode==="loop"||transitionBusy)return;

  transitionBusy=true;

  try{loopVideo.currentTime=loopPosition||0}catch(e){}

  loopVideo.muted=!audioUnlocked;
  loopVideo.volume=1;
  loopVideo.loop=true;

  loopVideo.play().catch(()=>{});

  loopVideo.classList.add("visible");
  hideAllDirectionVideos();

  mode="loop";
  finger.style.opacity="0";

  setTimeout(()=>{
    allDirectionVideos.forEach(video=>video.pause());
    transitionBusy=false;
  },0);
}

allDirectionVideos.forEach(video=>{
  video.addEventListener("ended",returnToLoop);
});

function aim(x,y){
  const r=stage.getBoundingClientRect();
  const nx=Math.max(0,Math.min(1,(x-r.left)/r.width));
  const ny=Math.max(0,Math.min(1,(y-r.top)/r.height));

  finger.style.opacity="1";
  finger.style.left=(nx*100)+"%";
  finger.style.top=(ny*100)+"%";

  if(nx>=2/3&&ny<1/3)showDirection("curtain");
  else if(nx>=1/3&&nx<2/3&&ny<1/3)showDirection("centerUp");
  else if(nx<1/3)showDirection("screenLeft");
  else if(nx>=1/3&&nx<2/3&&ny>=2/3)showDirection("centerDown");
  else if(nx>=2/3)showDirection("centerRight");
}

stage.addEventListener("pointerdown",e=>{
  e.preventDefault();
  unlockAudio();
  stage.setPointerCapture?.(e.pointerId);
  aim(e.clientX,e.clientY);
},{passive:false});

stage.addEventListener("pointermove",e=>{
  if(e.buttons||e.pointerType==="touch"){
    const r=stage.getBoundingClientRect();
    const nx=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    const ny=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
    finger.style.opacity="1";
    finger.style.left=(nx*100)+"%";
    finger.style.top=(ny*100)+"%";
  }
},{passive:false});

stage.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});

loopVideo.play().catch(()=>{});
preloadDirectionVideos();
</script>
</body>
</html>
