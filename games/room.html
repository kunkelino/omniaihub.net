<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <title>What? Are You Looking At?</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:#050505;color:#f4efe6;font-family:Georgia,"Times New Roman",serif;height:100%}
    body{min-height:100dvh;overflow:hidden;touch-action:none}
    .app{min-height:100dvh;display:flex;flex-direction:column}
    .top{text-align:center;padding:12px 16px 0;flex:none}
    .kicker{letter-spacing:.42em;font-size:10px;font-family:Arial,sans-serif;opacity:.55}
    h1{margin:6px 0 0;font-weight:500;letter-spacing:.08em;font-size:clamp(22px,6.2vw,40px)}

    .stage{
      position:relative;
      flex:none;
      width:min(calc(100vw - 16px),1200px);
      aspect-ratio:16/9;
      margin:10px auto 42px;
      border-radius:18px;
      overflow:hidden;
      background:#111;
      touch-action:none;
      box-shadow:0 20px 60px #000;
    }

    .video{
      position:absolute;
      left:0;
      top:0;
      width:100%;
      height:108%;
      object-fit:cover;
      object-position:center top;
      background:#111;
      opacity:0;
      transition:opacity .55s ease-in-out;
      pointer-events:none;
    }

    .video.visible{opacity:1}

    .shade{
      position:absolute;
      inset:0;
      pointer-events:none;
      background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 12%,transparent 78%,rgba(0,0,0,.28));
      z-index:4;
    }

    .finger{
      position:absolute;
      z-index:6;
      width:30px;
      height:30px;
      border:1.5px solid rgba(255,255,255,.9);
      border-radius:50%;
      transform:translate(-50%,-50%);
      opacity:0;
      pointer-events:none;
      box-shadow:0 0 0 8px rgba(255,255,255,.08);
    }

    .back{
      position:absolute;
      z-index:7;
      left:12px;
      top:12px;
      color:#fff;
      text-decoration:none;
      font-family:Arial,sans-serif;
      font-size:12px;
      letter-spacing:.08em;
      background:rgba(0,0,0,.45);
      padding:7px 10px;
      border-radius:999px;
    }

    @media (orientation:portrait){
      .top{padding-top:8px}
      .kicker{font-size:8px}
      h1{font-size:clamp(18px,6vw,28px)}
      .stage{
        width:min(calc(100vw - 16px),calc((100dvh - 92px) * 9 / 16));
        aspect-ratio:9/16;
        margin:8px auto 18px;
      }
    }

    @media (orientation:landscape){
      .stage{
        width:min(calc(100vw - 16px),1200px);
        aspect-ratio:16/9;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="kicker">OMNIAIHUB</div>
    <h1>WHAT? ARE YOU LOOKING AT?</h1>
  </header>

  <section class="stage" id="stage">
    <video id="videoA" class="video" playsinline preload="auto"></video>
    <video id="videoB" class="video" playsinline preload="auto"></video>
    <div class="shade"></div>
    <div class="finger" id="finger"></div>
  </section>
</div>

<script>
const stage = document.getElementById("stage");
const finger = document.getElementById("finger");

const videos = [
  document.getElementById("videoA"),
  document.getElementById("videoB")
];

// EXACT FILE NAMES.
// Keep these names when replacing the video files.
const clips = {
  loop: "loop.mp4",
  screenLeft: "rightcenter.mp4",
  centerDown: "centerdown.mp4",
  centerRight: "leftcenter.mp4",
  curtain: "curtain.mp4",
  centerUp: "up.mp4"
};

let active = 0;
let mode = "loop";
let loopPosition = 0;
let audioUnlocked = false;
let transitionBusy = false;
let transitionToken = 0;

function unlockAudio() {
  audioUnlocked = true;
  for (const video of videos) {
    video.muted = false;
    video.volume = 1;
  }
}

function otherIndex() {
  return active === 0 ? 1 : 0;
}

function loadVideo(index, src, startAt = 0) {
  const video = videos[index];

  video.pause();
  video.src = src;
  video.load();

  return new Promise(resolve => {
    const start = () => {
      try {
        video.currentTime = Math.max(0, startAt || 0);
      } catch(e) {}

      video.muted = !audioUnlocked;
      video.volume = 1;
      resolve(video);
    };

    if (video.readyState >= 1) {
      start();
    } else {
      video.addEventListener("loadedmetadata", start, {once:true});
    }
  });
}

async function startLoop(startAt = 0) {
  const token = ++transitionToken;
  transitionBusy = true;

  const index = mode === "loop" ? active : otherIndex();
  const video = await loadVideo(index, clips.loop, startAt);

  if (token !== transitionToken) return;

  video.loop = true;
  video.muted = !audioUnlocked;
  video.volume = 1;

  await video.play().catch(() => {});

  videos[active].classList.remove("visible");
  video.classList.add("visible");

  active = index;
  mode = "loop";

  setTimeout(() => {
    if (token === transitionToken) transitionBusy = false;
  }, 600);
}

async function playDirection(which) {
  if (transitionBusy || mode === which) return;

  const loopVideo = videos[active];

  if (mode === "loop") {
    // Save the exact point where the loop was interrupted.
    loopPosition = loopVideo.currentTime || 0;
    loopVideo.pause();
  }

  const next = otherIndex();
  const token = ++transitionToken;
  transitionBusy = true;

  const directionVideo = await loadVideo(next, clips[which], 0);

  if (token !== transitionToken) return;

  directionVideo.loop = false;
  directionVideo.muted = !audioUnlocked;
  directionVideo.volume = 1;

  // Fade from the loop into the direction clip.
  directionVideo.classList.add("visible");
  loopVideo.classList.remove("visible");

  active = next;
  mode = which;

  // The direction video plays ALL THE WAY to its natural end.
  await directionVideo.play().catch(() => {});
  transitionBusy = false;
}

async function returnToLoop() {
  if (mode === "loop" || transitionBusy) return;

  const directionVideo = videos[active];
  const loopIndex = otherIndex();
  const token = ++transitionToken;
  transitionBusy = true;

  // Load the loop at the exact timestamp where it was interrupted.
  const loopVideo = await loadVideo(loopIndex, clips.loop, loopPosition);

  if (token !== transitionToken) return;

  loopVideo.loop = true;
  loopVideo.muted = !audioUnlocked;
  loopVideo.volume = 1;

  // Start the loop underneath, then cross-fade back to it.
  await loopVideo.play().catch(() => {});
  loopVideo.classList.add("visible");
  directionVideo.classList.remove("visible");

  active = loopIndex;
  mode = "loop";
  finger.style.opacity = "0";

  setTimeout(() => {
    directionVideo.pause();
    if (token === transitionToken) transitionBusy = false;
  }, 600);
}

videos.forEach((video, index) => {
  video.addEventListener("ended", () => {
    if (index === active && mode !== "loop") {
      returnToLoop();
    }
  });
});

function aim(x, y) {
  const r = stage.getBoundingClientRect();
  const nx = Math.max(0, Math.min(1, (x - r.left) / r.width));
  const ny = Math.max(0, Math.min(1, (y - r.top) / r.height));

  finger.style.opacity = "1";
  finger.style.left = (nx * 100) + "%";
  finger.style.top = (ny * 100) + "%";

  /*
    SCREEN HOTSPOTS:

    LEFT SIDE            = rightcenter.mp4
    CENTER BOTTOM        = centerdown.mp4
    CENTER RIGHT         = leftcenter.mp4
    CENTER TOP           = up.mp4
    VERY TOP-RIGHT       = curtain.mp4

    The curtain hotspot is the upper-right corner of the screen.
    The regular right-side hotspot is the center-right portion.
  */

  // Very top-right corner: curtain.
  if (nx >= 2/3 && ny < 1/3) {
    playDirection("curtain");

  // Center top: up.
  } else if (nx >= 1/3 && nx < 2/3 && ny < 1/3) {
    playDirection("centerUp");

  // Left side.
  } else if (nx < 1/3) {
    playDirection("screenLeft");

  // Center bottom.
  } else if (nx >= 1/3 && nx < 2/3 && ny >= 2/3) {
    playDirection("centerDown");

  // Regular center-right.
  } else if (nx >= 2/3) {
    playDirection("centerRight");
  }
}

stage.addEventListener("pointerdown", e => {
  e.preventDefault();
  unlockAudio();
  stage.setPointerCapture?.(e.pointerId);
  aim(e.clientX, e.clientY);
}, {passive:false});

stage.addEventListener("pointermove", e => {
  if (e.buttons || e.pointerType === "touch") {
    const r = stage.getBoundingClientRect();
    const nx = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    const ny = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));

    finger.style.opacity = "1";
    finger.style.left = (nx * 100) + "%";
    finger.style.top = (ny * 100) + "%";
  }
}, {passive:false});

stage.addEventListener("touchmove", e => e.preventDefault(), {passive:false});

// Start the main loop.
startLoop(0);
</script>
</body>
</html>
