<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>They're Watching You</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#050505;color:#f4efe6;font-family:Georgia,"Times New Roman",serif;height:100%}
body{min-height:100dvh;overflow:hidden;touch-action:none}
.app{height:100dvh;display:flex;flex-direction:column}
.top{text-align:center;padding:12px 16px 0}
.kicker{letter-spacing:.42em;font-size:10px;font-family:Arial,sans-serif;opacity:.55}
h1{margin:6px 0 0;font-weight:500;letter-spacing:.08em;font-size:clamp(22px,6.2vw,40px)}
.sub{font-family:Arial,sans-serif;font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.72;min-height:18px;margin-top:6px}
.stage{position:relative;flex:1;margin:10px 8px 42px;border-radius:18px;overflow:hidden;background:#111;touch-action:none;box-shadow:0 20px 60px #000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 12%,transparent 78%,rgba(0,0,0,.28))}
.finger{position:absolute;z-index:6;width:30px;height:30px;border:1.5px solid rgba(255,255,255,.9);border-radius:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;box-shadow:0 0 0 8px rgba(255,255,255,.08)}
.back{position:absolute;z-index:7;left:12px;top:12px;color:#fff;text-decoration:none;font-family:Arial,sans-serif;font-size:12px;letter-spacing:.08em;background:rgba(0,0,0,.45);padding:7px 10px;border-radius:999px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="kicker">OMNIAIHUB</div>
    <h1>THEY'RE WATCHING YOU</h1>
    <div class="sub" id="line">They're talking. Point somewhere.</div>
  </header>
  <section class="stage" id="stage">
    <video id="player" playsinline muted autoplay loop></video>
    <div class="shade"></div>
    <a class="back" href="../games.html">Games</a>
    <div class="finger" id="finger"></div>
  </section>
</div>
<script src="/copyright.js"></script>
<script>
const stage = document.getElementById("stage");
const line = document.getElementById("line");
const finger = document.getElementById("finger");
const player = document.getElementById("player");
const clips = {
  loop: "room/loop.mp4",
  left: "room/screenleft.mp4",
  right: "room/screenright.mp4",
  down: "room/screendown.mp4"
};
const labels = { loop: "They're talking.", left: "Looking screen left.", right: "Looking screen right.", down: "Looking down." };
let shown = null;
function play(which){
  if (shown === which && !player.paused && player.currentTime > 0.15) return;
  shown = which;
  player.src = clips[which];
  player.loop = which === "loop";
  player.muted = which === "loop";
  player.currentTime = 0;
  player.play().catch(()=>{});
  line.textContent = labels[which];
}
player.addEventListener("ended", () => { if (shown !== "loop") { finger.style.opacity = "0"; play("loop"); } });
function aim(x,y){
  const r = stage.getBoundingClientRect();
  const nx = Math.max(0, Math.min(1, (x - r.left) / r.width));
  const ny = Math.max(0, Math.min(1, (y - r.top) / r.height));
  finger.style.opacity = "1";
  finger.style.left = (nx * 100) + "%";
  finger.style.top = (ny * 100) + "%";
  play(ny > 0.62 ? "down" : (nx < 0.5 ? "left" : "right"));
}
stage.addEventListener("pointerdown", e => { stage.setPointerCapture?.(e.pointerId); aim(e.clientX, e.clientY); }, {passive:false});
stage.addEventListener("pointermove", e => { if (e.buttons || e.pointerType === "touch") aim(e.clientX, e.clientY); }, {passive:false});
stage.addEventListener("pointerup", () => setTimeout(() => { finger.style.opacity = "0"; play("loop"); }, 2400));
stage.addEventListener("touchmove", e => e.preventDefault(), {passive:false});
play("loop");
</script>
</body>
</html>
