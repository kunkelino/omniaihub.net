<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>They're Watching You</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#050505;color:#f4efe6;font-family:Georgia,"Times New Roman",serif;height:100%}
body{min-height:100vh;overflow:hidden;touch-action:none}
.app{height:100vh;display:flex;flex-direction:column}
.top{position:relative;z-index:4;text-align:center;padding:14px 16px 0}
.kicker{letter-spacing:.42em;font-size:10px;font-family:Arial,sans-serif;opacity:.55}
h1{margin:6px 0 0;font-weight:500;letter-spacing:.08em;font-size:clamp(22px,6.4vw,42px)}
.sub{font-family:Arial,sans-serif;font-size:13px;letter-spacing:.18em;text-transform:uppercase;opacity:.72;min-height:18px;margin-top:6px}
.stage{position:relative;flex:1;margin:10px 8px 46px;border-radius:18px;overflow:hidden;background:#111 center/cover no-repeat;touch-action:none;box-shadow:0 20px 60px #000;background-image:url("watching/room.jpg")}
.grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 16%,transparent 48%,rgba(0,0,0,.62));pointer-events:none}
.grain{position:absolute;inset:-20%;pointer-events:none;opacity:.16;mix-blend-mode:overlay;background-image:radial-gradient(rgba(255,255,255,.4) .6px,transparent .7px);background-size:3px 3px;animation:drift 8s linear infinite}
@keyframes drift{to{transform:translate3d(-20px,12px,0)}}
.sofa{position:absolute;left:6%;right:6%;bottom:7%;height:34%;border-radius:18px 18px 10px 10px;background:linear-gradient(180deg,#6d5b4c 0%,#4a3b32 42%,#2c241e 100%);box-shadow:0 18px 30px rgba(0,0,0,.45),inset 0 10px 18px rgba(255,255,255,.06);z-index:2}
.sofa:before{content:"";position:absolute;left:4%;right:4%;top:-16%;height:28%;border-radius:16px 16px 6px 6px;background:linear-gradient(180deg,#7a6756,#514338)}
.cushion{position:absolute;top:18%;bottom:16%;width:22%;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.12));box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.chair{position:absolute;right:4%;bottom:18%;width:24%;height:38%;border-radius:16px 16px 8px 8px;background:linear-gradient(180deg,#5c4c40,#322820);box-shadow:0 16px 24px rgba(0,0,0,.4);z-index:2}
.chair:before{content:"";position:absolute;left:8%;right:8%;top:-22%;height:34%;border-radius:12px;background:#6a5848}
.table{position:absolute;left:28%;right:30%;bottom:4%;height:11%;border-radius:8px;background:#2a211b;box-shadow:0 8px 16px rgba(0,0,0,.4);z-index:5}
.person{position:absolute;width:27vw;max-width:168px;min-width:108px;height:46%;transform:translate(-50%,0);z-index:4;filter:drop-shadow(0 16px 12px rgba(0,0,0,.45));will-change:transform}
.body{position:absolute;left:18%;right:18%;bottom:0;height:62%;border-radius:40% 40% 12% 12%;transform-origin:50% 100%}
.neck{position:absolute;left:42%;right:42%;bottom:54%;height:10%;background:#c9a27a;border-radius:6px}
.headwrap{position:absolute;left:8%;right:8%;top:0;height:52%;transform-origin:50% 88%;will-change:transform}
.face{width:100%;height:100%;object-fit:cover;border-radius:46% 46% 42% 42%;box-shadow:0 8px 16px rgba(0,0,0,.35)}
.talk{position:absolute;left:38%;right:38%;bottom:18%;height:7%;border-radius:40%;background:rgba(40,20,16,.55);transform-origin:50% 0;opacity:.0}
.finger{position:absolute;width:28px;height:28px;border:1.5px solid rgba(255,255,255,.85);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:8;opacity:0;box-shadow:0 0 0 7px rgba(255,255,255,.08)}
.back{position:absolute;z-index:9;left:12px;top:12px;color:#fff;text-decoration:none;font-family:Arial,sans-serif;font-size:12px;letter-spacing:.08em;background:rgba(0,0,0,.45);padding:7px 10px;border-radius:999px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="kicker">OMNIAIHUB</div>
    <h1>THEY'RE WATCHING YOU</h1>
    <div class="sub" id="line">Move your finger.</div>
  </header>
  <section class="stage" id="stage">
    <div class="grade"></div>
    <div class="grain"></div>
    <div class="sofa" aria-hidden="true"><div class="cushion" style="left:6%"></div><div class="cushion" style="left:39%"></div><div class="cushion" style="left:70%"></div></div>
    <div class="chair" aria-hidden="true"></div>
    <div class="table" aria-hidden="true"></div>
    <a class="back" href="../games.html">Games</a>
    <div class="finger" id="finger"></div>
  </section>
</div>
<script src="/copyright.js"></script>
<script>
const stage = document.getElementById("stage");
const line = document.getElementById("line");
const finger = document.getElementById("finger");
const cast = [
  {src:"watching/p4.jpg", x:20, y:46, color:"#6e7c8a", delay:0.15, talkTo:1},
  {src:"watching/p1.jpg", x:38, y:44, color:"#d7d2cb", delay:0.4, talkTo:0},
  {src:"watching/p3.jpg", x:56, y:47, color:"#7a2f32", delay:0.7, talkTo:2},
  {src:"watching/p6.jpg", x:74, y:45, color:"#5d6b52", delay:0.95, talkTo:2},
  {src:"watching/p2.jpg", x:84, y:40, color:"#31425c", delay:0.55, talkTo:3, chair:true}
];
cast.forEach((p,i)=>{
  const el = document.createElement("div");
  el.className = "person";
  el.style.left = p.x+"%";
  el.style.top = p.y+"%";
  el.style.zIndex = String(6+i);
  el.innerHTML = '<div class="body"></div><div class="neck"></div><div class="headwrap"><img class="face" alt=""><div class="talk"></div></div>';
  el.querySelector(".body").style.background = "linear-gradient(180deg,"+p.color+","+p.color+"cc)";
  el.querySelector(".face").src = p.src;
  stage.appendChild(el);
  p.el = el;
  p.head = el.querySelector(".headwrap");
  p.body = el.querySelector(".body");
  p.talk = el.querySelector(".talk");
  p.look = 0;
  p.lean = 0;
});
let px = 0.5, py = 0.45, has = false, t0 = 0, moved = 0, audioOn = false;
function setTarget(clientX, clientY){
  const r = stage.getBoundingClientRect();
  const nx = Math.max(0, Math.min(1, (clientX-r.left)/r.width));
  const ny = Math.max(0, Math.min(1, (clientY-r.top)/r.height));
  moved += Math.hypot(nx-px, ny-py);
  px = nx; py = ny;
  if(!has){ has = true; t0 = performance.now(); }
  finger.style.opacity = "1";
  finger.style.left = (nx*100)+"%";
  finger.style.top = (ny*100)+"%";
  startAudio();
}
stage.addEventListener("pointerdown", e=>{ stage.setPointerCapture?.(e.pointerId); setTarget(e.clientX,e.clientY); }, {passive:false});
stage.addEventListener("pointermove", e=>{ if(e.buttons||e.pointerType==="touch"||has) setTarget(e.clientX,e.clientY); }, {passive:false});
stage.addEventListener("touchmove", e=>e.preventDefault(), {passive:false});
let ctx, noise;
function startAudio(){
  if(audioOn) return;
  audioOn = true;
  const AC = window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  ctx = new AC();
  ctx.resume();
  const len = ctx.sampleRate*2;
  const buf = ctx.createBuffer(1,len,ctx.sampleRate);
  const data = buf.getChannelData(0);
  let b0=0,b1=0;
  for(let i=0;i<len;i++){
    const w = Math.random()*2-1;
    b0 = 0.997*b0+0.029*w; b1 = 0.985*b1+0.06*w;
    data[i] = (b1+b0*0.4)*0.35;
  }
  noise = ctx.createBufferSource();
  noise.buffer = buf; noise.loop = true;
  const filter = ctx.createBiquadFilter();
  filter.type = "lowpass"; filter.frequency.value = 380;
  const gain = ctx.createGain(); gain.gain.value = 0.04;
  noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination); noise.start();
}
function tick(now){
  const elapsed = has ? (now-t0)/1000 : 0;
  const awareness = has ? Math.max(0, Math.min(1, elapsed/6 + Math.min(0.3, moved*0.18))) : 0;
  line.textContent = !has || awareness < 0.4 ? "Move your finger." : "They can see you.";
  cast.forEach((p,i)=>{
    const noticed = awareness > 0.08 + p.delay*0.35;
    const mate = cast[p.talkTo] || p;
    const idle = ((mate.x/100) - (p.x/100)) * 1.4;
    const want = noticed ? (px - p.x/100) * 2.2 : idle + Math.sin(now/1400+i)*0.08;
    p.look += (want - p.look) * (noticed ? 0.06 : 0.03);
    const wantLean = noticed ? Math.max(-1, Math.min(1, (px - p.x/100)*1.6)) : Math.sin(now/1600+i)*0.08;
    p.lean += (wantLean - p.lean) * 0.04;
    const bob = Math.sin(now/680+i)*2.2;
    const talking = !noticed && Math.sin(now/420+i*1.7) > 0.35;
    p.el.style.transform = "translate(-50%,0) translateX("+ (p.lean*10) +"px)";
    p.body.style.transform = "rotate("+ (p.lean*7) +"deg)";
    p.head.style.transform = "translateY("+bob+"px) rotate("+ (p.look*16) +"deg) rotateX("+ (noticed?(py-0.45)*10:0) +"deg)";
    p.talk.style.opacity = talking ? "0.85" : "0.15";
    p.talk.style.transform = "scaleY("+ (talking?1.6:0.5) +")";
  });
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
