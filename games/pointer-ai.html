<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Knows Where You're Looking</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#080808;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif}body{min-height:100vh;display:flex;justify-content:center}.app{width:min(100vw,900px);min-height:100vh;display:flex;flex-direction:column}.top{text-align:center;padding:16px 16px 8px}.k{font-size:11px;letter-spacing:.18em;opacity:.6}.top h1{font-size:clamp(25px,6vw,50px);line-height:.95;margin:7px 0}.sub{font-size:14px;opacity:.7}.stage{position:relative;flex:1;min-height:650px;margin:8px 10px 12px;border-radius:26px;overflow:hidden;background:radial-gradient(circle at 50% 25%,#454d58,#181b20 55%,#050505);box-shadow:0 20px 70px #000}.stage:after{content:"";position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(transparent,#050505)}.floor{position:absolute;left:5%;right:5%;bottom:3%;height:23%;border-radius:50%;background:radial-gradient(ellipse,#333840,#111318 60%,transparent 72%)}.person{position:absolute;width:110px;height:235px;transform:translate(-50%,-50%);filter:drop-shadow(0 10px 8px #0009)}.head{position:absolute;left:36px;top:7px;width:40px;height:48px;border-radius:50%;background:linear-gradient(135deg,#f1c3a0,#8c5b47)}.body{position:absolute;left:23px;top:53px;width:66px;height:105px;border-radius:22px 22px 13px 13px;background:linear-gradient(135deg,var(--shirt),#171717)}.leg{position:absolute;top:148px;width:25px;height:84px;border-radius:14px;background:#17191c}.l{left:28px}.r{left:57px}.arm{position:absolute;top:64px;width:18px;height:90px;border-radius:12px;background:#d19a79;transform-origin:50% 8px;transition:transform .09s linear}.arm.a{left:10px}.arm.b{right:10px}.hand{position:absolute;width:29px;height:18px;border-radius:12px;background:#d19a79;top:-5px;left:-5px}.cursor{position:absolute;width:34px;height:34px;border:2px solid white;border-radius:50%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;box-shadow:0 0 0 8px #fff2,0 0 35px #fff8}.cursor:after{content:"";position:absolute;inset:9px;background:white;border-radius:50%}.hint{position:absolute;z-index:7;left:50%;bottom:28px;transform:translateX(-50%);background:#000c;padding:10px 15px;border-radius:999px;font-size:13px;white-space:nowrap}.tag{position:absolute;z-index:7;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.15em;opacity:.5}.controls{text-align:center;padding:0 12px 18px}button{background:#fff;color:#000;border:0;border-radius:999px;padding:12px 20px;font-weight:800}button:active{transform:scale(.97)}</style></head><body><main class="app"><header class="top"><div class="k">AI EXPERIMENT</div><h1>AI KNOWS WHERE YOU'RE LOOKING</h1><div class="sub">Move your finger. Watch them point.</div></header><section class="stage" id="stage"><div class="floor"></div>
<div class="person" style="left:16%;top:42%;--shirt:#a93333"><i class="head"></i><i class="body"></i><i class="leg l"></i><i class="leg r"></i><i class="arm a"><i class="hand"></i></i><i class="arm b"><i class="hand"></i></i></div>
<div class="person" style="left:38%;top:33%;--shirt:#315b9b"><i class="head"></i><i class="body"></i><i class="leg l"></i><i class="leg r"></i><i class="arm a"><i class="hand"></i></i><i class="arm b"><i class="hand"></i></i></div>
<div class="person" style="left:62%;top:34%;--shirt:#7951a4"><i class="head"></i><i class="body"></i><i class="leg l"></i><i class="leg r"></i><i class="arm a"><i class="hand"></i></i><i class="arm b"><i class="hand"></i></i></div>
<div class="person" style="left:84%;top:43%;--shirt:#9a642d"><i class="head"></i><i class="body"></i><i class="leg l"></i><i class="leg r"></i><i class="arm a"><i class="hand"></i></i><i class="arm b"><i class="hand"></i></i></div>
<div class="person" style="left:50%;top:67%;--shirt:#28705d"><i class="head"></i><i class="body"></i><i class="leg l"></i><i class="leg r"></i><i class="arm a"><i class="hand"></i></i><i class="arm b"><i class="hand"></i></i></div>
<div class="cursor" id="cursor"></div><div class="hint" id="hint">👆 Move your finger anywhere</div><div class="tag">DON'T BLINK</div></section><div class="controls"><button id="random">🎲 RANDOM TARGET</button></div></main>
<script>const s=document.getElementById('stage'),c=document.getElementById('cursor'),hint=document.getElementById('hint'),people=[...document.querySelectorAll('.person')];function move(px,py){const r=s.getBoundingClientRect();const x=Math.max(0,Math.min(1,(px-r.left)/r.width)),y=Math.max(0,Math.min(1,(py-r.top)/r.height));c.style.left=x*100+'%';c.style.top=y*100+'%';people.forEach(p=>{const b=p.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2,a=Math.atan2(py-cy,px-cx)*180/Math.PI;p.querySelector('.a').style.transform='rotate('+(a+18)+'deg)';p.querySelector('.b').style.transform='rotate('+(a-18)+'deg)'});hint.style.opacity=0}s.addEventListener('pointermove',e=>move(e.clientX,e.clientY));s.addEventListener('pointerdown',e=>move(e.clientX,e.clientY));document.getElementById('random').onclick=()=>{const r=s.getBoundingClientRect();move(r.left+r.width*(.12+.76*Math.random()),r.top+r.height*(.15+.7*Math.random()))};</script></body></html>
