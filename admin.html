<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Store Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07040f;color:#e4c56a;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:28px 18px 60px}h1{margin:0 0 6px}.muted{color:#cbb89a}.panel{border:1px solid rgba(228,197,106,.4);border-radius:14px;padding:18px;margin-top:18px;background:#100b19}.login{max-width:420px;margin:8vh auto}.field{display:grid;gap:6px;margin:10px 0}input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #6b5a2c;background:#07040f;color:#fff}button{border:1px solid #e4c56a;background:#e4c56a;color:#07040f;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.product{border:1px solid rgba(228,197,106,.25);padding:12px;border-radius:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.order{border-top:1px solid rgba(228,197,106,.2);padding:14px 0}.ok{color:#b7f7c0}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="panel login"><h1>Store Admin</h1><p class="muted">Inventory and orders</p>
<form id="loginForm"><div class="field"><label>Username</label><input id="username" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button>Sign in</button><p id="loginMsg"></p></form></div>
<div id="app" hidden><h1>Store Admin</h1><p class="muted">Inventory → shipping → orders → tracking</p>
<div class="panel"><h2>Inventory</h2><div id="products" class="grid"></div><button id="saveInventory">Save inventory</button><p id="saveMsg"></p></div>
<div class="panel"><h2>Shipping</h2><div class="row"><div class="field"><label>Standard shipping</label><input id="standard" type="number" step=".01"></div><div class="field"><label>Priority shipping</label><input id="priority" type="number" step=".01"></div></div><div class="field"><label>Free shipping over</label><input id="freeOver" type="number" step=".01"></div><button id="saveShipping">Save shipping</button><p id="shipMsg"></p></div>
<div class="panel"><h2>Orders</h2><div id="orders"></div></div></div></div>
<script>
const $=id=>document.getElementById(id);
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginMsg").textContent="Signing in…";const r=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("username").value,password:$("password").value})});const j=await r.json();if(!r.ok){$("loginMsg").textContent=j.error||"Login failed.";return}$("login").hidden=true;$("app").hidden=false;load();});
async function load(){const [i,o]=await Promise.all([fetch("/api/inventory"),fetch("/api/orders")]);if(i.status===401){$("app").hidden=true;$("login").hidden=false;return}const inv=await i.json(),ord=await o.json();renderProducts(inv);renderOrders(ord.orders||[]);}
function renderProducts(data){$("products").innerHTML="";data.products.forEach(p=>{const d=document.createElement("div");d.className="product";d.innerHTML="<strong>"+p.name+"</strong><div class='field'><label>Price</label><input data-id='"+p.id+"' data-k='price' type='number' step='.01' value='"+p.price+"'></div><div class='field'><label>Inventory</label><input data-id='"+p.id+"' data-k='inventory' type='number' min='0' step='1' value='"+p.inventory+"'></div>";$("products").appendChild(d);});$("standard").value=data.shipping.standard;$("priority").value=data.shipping.priority;$("freeOver").value=data.shipping.freeOver;}
$("saveInventory").onclick=async()=>{const products=[...document.querySelectorAll("#products .product")].map(d=>({id:d.querySelector("[data-k=price]").dataset.id,price:Number(d.querySelector("[data-k=price]").value),inventory:Number(d.querySelector("[data-k=inventory]").value)}));const r=await fetch("/api/inventory",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({products})});$("saveMsg").textContent=r.ok?"Saved.":"Could not save.";};
$("saveShipping").onclick=async()=>{const r=await fetch("/api/inventory",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({shipping:{standard:Number($("standard").value),priority:Number($("priority").value),freeOver:Number($("freeOver").value)}})});$("shipMsg").textContent=r.ok?"Saved.":"Could not save.";};
function renderOrders(orders){$("orders").innerHTML=orders.length?"":"<p class='muted'>No orders yet.</p>";orders.forEach(o=>{const d=document.createElement("div");d.className="order";d.innerHTML="<strong>"+o.id+"</strong> — "+o.status+" — $"+Number(o.total).toFixed(2)+"<br><span class='muted'>"+new Date(o.createdAt).toLocaleString()+"</span><p>"+o.items.map(i=>i.name+" × "+i.quantity).join("<br>")+"</p><p>"+o.customer.name+"<br>"+o.customer.address+"<br>"+o.customer.city+", "+o.customer.state+" "+o.customer.zip+"</p><div class='row'><select class='status'><option>Test order</option><option>Paid</option><option>Processing</option><option>Shipped</option><option>Completed</option></select><input class='tracking' placeholder='Tracking number' value='"+(o.tracking||"")+"'></div><button class='update' data-id='"+o.id+"'>Update order</button>";d.querySelector(".status").value=o.status;$("orders").appendChild(d);});document.querySelectorAll(".update").forEach(b=>b.onclick=async()=>{const d=b.parentElement;await fetch("/api/orders",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:b.dataset.id,status:d.querySelector(".status").value,tracking:d.querySelector(".tracking").value})});load();});}
</script>
</body></html>
