<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Store Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07040f;color:#e4c56a;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 18px 60px}h1{margin:0 0 6px}.muted{color:#cbb89a}.panel{border:1px solid rgba(228,197,106,.4);border-radius:14px;padding:18px;margin-top:18px;background:#100b19}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.product,.order{border:1px solid rgba(228,197,106,.25);padding:14px;border-radius:10px}.field{display:grid;gap:6px;margin:10px 0}input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #6b5a2c;background:#07040f;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:1px solid #e4c56a;background:#e4c56a;color:#07040f;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}.order{margin-top:12px}.ok{color:#b7f7c0}@media(max-width:700px){.grid,.row{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><h1>Store Admin</h1><p class="muted">NO LOGIN REQUIRED · Inventory, shipping, customers, and orders</p>
<div class="panel"><h2>Inventory</h2><div id="products" class="grid"></div><button id="saveInventory">Save inventory</button><p id="saveMsg"></p></div>
<div class="panel"><h2>Shipping</h2><div class="row"><div class="field"><label>Standard shipping</label><input id="standard" type="number" value="5.99" readonly></div><div class="field"><label>Priority shipping</label><input id="priority" type="number" value="10.99" readonly></div></div><div class="field"><label>Free shipping over</label><input id="freeOver" type="number" step=".01"></div><button id="saveShipping">Save shipping</button><p id="shipMsg"></p></div>
<div class="panel"><h2>Customer Database / Orders</h2><div id="orders"></div></div></div>
<script>
const $=id=>document.getElementById(id);
async function load(){const [i,o]=await Promise.all([fetch("/api/store?action=inventory"),fetch("/api/store?action=orders")]);const inv=await i.json(),ord=await o.json();renderProducts(inv);renderOrders(ord.orders||[])}
function renderProducts(data){$("products").innerHTML="";data.products.forEach(p=>{const d=document.createElement("div");d.className="product";d.innerHTML="<strong>"+p.name+"</strong><div class='field'><label>Price</label><input data-id='"+p.id+"' data-k='price' type='number' step='.01' value='"+p.price+"'></div><div class='field'><label>Inventory</label><input data-id='"+p.id+"' data-k='inventory' type='number' min='0' value='"+p.inventory+"'></div>";$("products").appendChild(d)});$("standard").value=5.99;$("priority").value=10.99;$("freeOver").value=data.shipping.freeOver}
$("saveInventory").onclick=async()=>{const products=[...document.querySelectorAll("#products .product")].map(d=>({id:d.querySelector("[data-k=price]").dataset.id,price:Number(d.querySelector("[data-k=price]").value),inventory:Number(d.querySelector("[data-k=inventory]").value)}));const r=await fetch("/api/store?action=inventory",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({products})});$("saveMsg").textContent=r.ok?"Saved.":"Could not save."};
$("saveShipping").onclick=async()=>{const r=await fetch("/api/store?action=inventory",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({shipping:{standard:5.99,priority:10.99,freeOver:Number($("freeOver").value)}})});$("shipMsg").textContent=r.ok?"Saved.":"Could not save."};
function renderOrders(orders){$("orders").innerHTML=orders.length?"":"<p class='muted'>No orders yet.</p>";orders.forEach(o=>{const d=document.createElement("div");d.className="order";d.innerHTML="<strong>"+o.id+"</strong> — "+o.status+" — $"+Number(o.total).toFixed(2)+"<br><span class='muted'>"+new Date(o.createdAt).toLocaleString()+"</span><p>"+o.items.map(i=>i.name+" × "+i.quantity).join("<br>")+"</p><p><strong>"+o.customer.name+"</strong><br>"+o.customer.phone+"<br>"+o.customer.email+"<br>"+o.customer.address+"<br>"+o.customer.city+", "+o.customer.state+" "+o.customer.zip+"</p><p>Payment: "+(o.paymentMethod||"card")+" · Shipping: "+o.shippingMethod+"</p><div class='row'><select class='status'><option>Test order</option><option>Paid</option><option>Processing</option><option>Shipped</option><option>Completed</option></select><input class='tracking' placeholder='Tracking number' value='"+(o.tracking||"")+"'></div><button class='update'>Update order</button>";d.querySelector(".status").value=o.status;d.querySelector(".update").onclick=async()=>{await fetch("/api/store?action=orders",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:o.id,status:d.querySelector(".status").value,tracking:d.querySelector(".tracking").value})});load()};$("orders").appendChild(d)})}
load();
</script></body></html>
