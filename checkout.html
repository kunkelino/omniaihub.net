<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout</title>
<style>body{margin:0;background:#07040f;color:#e4c56a;font-family:Arial,sans-serif}.wrap{max-width:620px;margin:auto;padding:28px 18px 60px}h1{letter-spacing:.12em}.panel{border:1px solid rgba(228,197,106,.4);border-radius:14px;padding:18px;margin-top:18px}.field{display:grid;gap:6px;margin:10px 0}input,select{padding:11px;border-radius:8px;border:1px solid #6b5a2c;background:#07040f;color:#fff}button{padding:12px 18px;border:1px solid #e4c56a;background:#e4c56a;color:#07040f;border-radius:8px;font-weight:700}.line{display:flex;justify-content:space-between;margin:8px 0}.muted{color:#cbb89a}.error{color:#ffb4b4}.success{color:#b7f7c0}</style></head>
<body><div class="wrap"><h1>CHECKOUT</h1><div class="panel"><div id="cart"></div><div class="line"><strong>Subtotal</strong><strong id="subtotal">$0.00</strong></div><div class="field"><label>Shipping</label><select id="shipping"><option value="standard">Standard</option><option value="priority">Priority</option></select></div><div class="line"><strong>Shipping cost</strong><strong id="shippingCost">$0.00</strong></div><div class="line"><strong>Total</strong><strong id="total">$0.00</strong></div></div>
<div class="panel"><h2>Ship to</h2><div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Street address</label><input id="address"></div><div class="field"><label>City</label><input id="city"></div><div class="field"><label>State</label><input id="state" maxlength="2"></div><div class="field"><label>ZIP</label><input id="zip"></div><button id="place">Place practice order</button><p class="muted">Practice mode only: this records the order and removes inventory. It does not charge a card.</p><p id="msg"></p></div></div>
<script>
const $=id=>document.getElementById(id),cart=JSON.parse(localStorage.getItem("sampleCart")||"[]");let shipping={standard:9.95,priority:19.95,freeOver:250};
async function init(){const r=await fetch("/api/store?action=inventory");if(!r.ok){$("msg").textContent="Backend storage is not connected yet.";return}const d=await r.json();shipping=d.shipping;render(d.products);}
function render(products){let subtotal=0;$("cart").innerHTML="";cart.forEach(i=>{const p=products.find(x=>x.id===i.id);if(!p)return;subtotal+=p.price*i.quantity;const d=document.createElement("div");d.className="line";d.innerHTML="<span>"+p.name+" × "+i.quantity+"</span><span>$"+(p.price*i.quantity).toFixed(2)+"</span>";$("cart").appendChild(d)});$("subtotal").textContent="$"+subtotal.toFixed(2);const cost=subtotal>=shipping.freeOver?0:(shipping[$("shipping").value]||0);$("shippingCost").textContent="$"+cost.toFixed(2);$("total").textContent="$"+(subtotal+cost).toFixed(2);}
$("shipping").onchange=()=>init();
$("place").onclick=async()=>{const body={items:cart,shippingMethod:$("shipping").value,customer:{name:$("name").value,email:$("email").value,phone:$("phone").value,address:$("address").value,city:$("city").value,state:$("state").value,zip:$("zip").value}};$("msg").textContent="Saving order…";const r=await fetch("/api/store?action=order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok){$("msg").className="error";$("msg").textContent=j.error||"Could not place order.";return}localStorage.removeItem("sampleCart");$("place").disabled=true;$("msg").className="success";$("msg").textContent="Practice order "+j.order.id+" created. Inventory was reduced.";};
init();
</script></body></html>
