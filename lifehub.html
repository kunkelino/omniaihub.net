<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>LifeHub — Your life. One place.</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--border:#e5e7eb;--primary:#4f46e5;--primary-dark:#3730a3;--danger:#dc2626;--shadow:0 8px 30px rgba(15,23,42,.08);--radius:18px;--sidebar-space:190px;--home-top-height:360px;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}
button,input,textarea,select{font:inherit;}
button{cursor:pointer;}
header{width:100%;min-height:108px;background:linear-gradient(135deg,#111827,#312e81);color:#fff;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.logo{font-size:30px;font-weight:800;}
.tagline{opacity:.85;margin-top:5px;}
nav{position:fixed;left:22px;top:130px;height:360px;width:178px;z-index:50;background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;padding:12px;}
nav button{width:100%;flex:1;border:0;background:#f3f4f6;padding:0 14px;border-radius:14px;display:flex;align-items:center;gap:10px;font-weight:700;}
nav button.active{background:var(--primary);color:#fff;}
.container{width:calc(100% - 234px);max-width:1200px;margin-left:212px;margin-right:22px;padding:22px 0;}
.page{display:none;}
.page.active{display:block;}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow);}
.home-top-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;margin-bottom:20px;}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:24px;min-height:220px;height:360px;padding:0;display:flex;flex-direction:column;overflow:hidden;}
.hero-top{flex:1;padding:16px 18px 10px;display:flex;flex-direction:column;justify-content:flex-start;}
.hero-top h1{margin:0 0 4px;font-size:22px;}
.hero-top p{margin:0 0 10px;opacity:.9;font-size:14px;}
.talk-big{width:100%;border:0;border-radius:15px;padding:10px;background:#fff;color:#312e81;font-size:15px;font-weight:800;}
.hero-summary{flex:2;background:rgba(255,255,255,.12);padding:12px 16px;overflow:auto;font-size:13px;}
.hero-summary h3{margin:0 0 8px;font-size:14px;}
.hero-summary div{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.15);}
.row-speak{display:flex;gap:8px;align-items:center;}
.row-speak input,.row-speak textarea{flex:1;}
.mic{border:0;background:#eef2ff;color:#312e81;border-radius:12px;padding:12px 14px;font-weight:800;white-space:nowrap;}
.media-wrap{min-width:0;display:flex;flex-direction:column;}
.media-card,.media-screen{width:100%;height:360px;border-radius:24px;overflow:hidden;position:relative;background:#111827;cursor:pointer;}
.media-screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;}
.media-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;color:#fff;font-weight:800;font-size:18px;background:linear-gradient(135deg,#111827,#312e81);}
.media-screen.loaded .media-placeholder{display:none;}
.media-screen.loaded iframe{display:block;}
.yt-feed-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;width:100%;}
.yt-feed-btn{border:0;background:#111827;color:#fff;font-weight:800;font-size:13px;padding:9px 12px;border-radius:14px;cursor:pointer;}
.yt-feed-btn.active{background:#4f46e5;}
.yt-feed-btn.fox-live{background:#0b1f4b;display:inline-flex;align-items:center;gap:8px;}
.yt-feed-btn.fox-live .live-dot{width:8px;height:8px;border-radius:50%;background:#e11d2e;box-shadow:0 0 0 0 rgba(225,29,46,.8);}
.yt-feed-btn.fox-live.live-on{animation:foxBtnPulse 1s ease-in-out infinite;}
.yt-feed-btn.fox-live.live-on .live-dot{animation:foxDotBlink 1s ease-in-out infinite;}
@keyframes foxBtnPulse{0%,100%{box-shadow:0 0 0 0 rgba(225,29,46,.55);}50%{box-shadow:0 0 0 6px rgba(225,29,46,0);}}
@keyframes foxDotBlink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.25;transform:scale(.7);}}
.fox-live-mark{font-weight:900;letter-spacing:.02em;}
.fox-live-mark span.now{color:#e11d2e;}
.fox-live-mark span.fox{color:#fff;}
.tri-box-row{display:flex;gap:16px;margin-bottom:18px;}
.box-35{width:3.5in;height:3.5in;flex:0 0 3.5in;background:#fff;border:1px solid var(--border);border-radius:18px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;}
.box-35 .box-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.box-35 .box-header h3{margin:0;font-size:15px;}
.box-35 .box-scroll-area{flex:1;overflow-y:auto;}
.mini-cal-header{text-align:center;font-weight:800;margin-bottom:6px;color:#3730a3;}
.mini-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;}
.mini-cal-day-label{font-size:10px;color:#6b7280;}
.mini-cal-cell{font-size:11px;padding:4px 0;border-radius:6px;background:#f9fafb;cursor:pointer;}
.mini-cal-cell.today{background:#c7d2fe;color:#312e81;font-weight:800;}
.mini-cal-cell.selected{background:#4f46e5;color:#fff;font-weight:800;outline:2px solid #312e81;}
.mini-cal-cell.empty{background:transparent;cursor:default;}
.ai-mini-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;height:100%;}
.ai-mini-btn{border:1px solid var(--border);background:#f8fafc;border-radius:12px;font-weight:800;}
.placeholder-box{height:auto;min-height:44px;width:100%;border:2px dashed var(--border);border-radius:14px;background:#fafafa;color:#6b7280;font-weight:700;margin-top:8px;}
.widget-list{display:flex;flex-direction:column;gap:8px;}
.widget-card{border:1px solid var(--border);border-radius:12px;padding:10px;background:#f8fafc;font-size:13px;font-weight:700;}
.widget-card a{color:#312e81;text-decoration:none;}
.cal-split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
.big-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;}
.big-cal-cell{padding:10px 0;border-radius:10px;background:#f9fafb;cursor:pointer;font-weight:700;}
.big-cal-cell.today{background:#c7d2fe;color:#312e81;}
.big-cal-cell.selected{background:#4f46e5;color:#fff;}
.big-cal-cell.empty{background:transparent;cursor:default;}
@media(max-width:900px){.cal-split{grid-template-columns:1fr;}}
form{display:grid;gap:12px;}
input,textarea{width:100%;padding:12px 14px;border:1px solid #d1d5db;border-radius:12px;}
textarea{min-height:100px;}
.primary{background:#4f46e5;color:#fff;border:0;padding:12px 16px;border-radius:12px;font-weight:700;}
.secondary{background:#f3f4f6;border:1px solid var(--border);padding:6px 10px;border-radius:8px;font-size:12px;}
.danger{background:#fee2e2;color:#dc2626;border:1px solid #fecaca;padding:8px 12px;border-radius:10px;}
.item{border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;background:#fff;}
.item.done{opacity:.62;}

/* HIDE CHECKED SHOPPING ITEMS ON MOBILE */
@media(max-width:900px) {
  #buyList .item.done { display: none !important; }
}

.item-title{font-weight:800;font-size:17px;}
.item-meta{color:#6b7280;font-size:14px;margin-top:5px;}
.item-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px;}
.action-google{background:#047857;color:#fff;border:0;padding:9px 12px;border-radius:10px;}
.action-apple{background:#111827;color:#fff;border:0;padding:9px 12px;border-radius:10px;}
.today-list{margin:0;padding:0;list-style:none;}
.today-list li{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.today-list .row-main{display:flex;align-items:center;gap:8px;width:100%;}
.today-list .row-actions{display:flex;gap:6px;margin-left:auto;}
.check{width:18px;height:18px;}
.empty{color:#6b7280;padding:15px 0;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:18px;}
.modal.show{display:flex;}
.modal-box{width:min(650px,100%);background:#fff;border-radius:22px;padding:24px;}
</style>
</head>
<body>

<header>
    <div class="logo">LifeHub</div>
    <div class="tagline">Your life. One place.</div>
</header>

<div class="container">
    <div class="home-top-layout">
        <!-- HERO CONTROLS PANEL -->
        <div class="hero">
            <div class="hero-top">
                <h1>Welcome Back</h1>
                <p>Manage your daily assets.</p>
                <button type="button" class="talk-big">Quick Command</button>
            </div>
            <div class="hero-summary">
                <h3>System Logs</h3>
                <div>Interface initialized smoothly.</div>
            </div>
        </div>

        <!-- MEDIA WRAPPER AREA -->
        <div class="media-wrap">
            <div class="media-screen">
                <div class="media-placeholder">Select a live media feed below to begin streaming.</div>
                <iframe src="" allowfullscreen></iframe>
            </div>
            <div class="yt-feed-row">
                <!-- INTEGRATED BOSTON NEWS LINK -->
                <button type="button" class="yt-feed-btn" id="bostonNewsBtn">📺 Boston Live News</button>
            </div>
        </div>
    </div>
</div>

<!-- FUNCTIONAL SCRIPT CORE -->
<script>
document.getElementById('bostonNewsBtn').addEventListener('click', function() {
    var mediaScreen = document.querySelector('.media-screen');
    var iframe = mediaScreen.querySelector('iframe');
    
    // Connects layout to public CBS Boston feed stream wrapper
    iframe.src = "https://cbsnews.com";
    
    // Toggle system rendering classes
    mediaScreen.classList.add('loaded');
    iframe.style.display = "block";
    
    // Manage layout active states cleanly
