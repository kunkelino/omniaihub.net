<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeHub</title>
</head>
<body>
<script>
(function(){
  var SRCS=[
    "https://cdn.jsdelivr.net/gh/kunkelino/omniaihub.net@41451a1d8dcd59ae570824ee3277031194ef3959/lifehub.html",
    "https://raw.githubusercontent.com/kunkelino/omniaihub.net/41451a1d8dcd59ae570824ee3277031194ef3959/lifehub.html"
  ];
  function load(i){
    if(i>=SRCS.length){ document.body.textContent="Could not load LifeHub. Refresh."; return; }
    fetch(SRCS[i],{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error(); return r.text(); }).then(function(html){
    html=html.replace("let tasks=","var tasks=");
    html=html.replace("let buy=","var buy=");
    html=html.replace("let events=","var events=");
    html=html.replace("let notes=","var notes=");
    html=html.replace(
      "function saveAll(){\n  localStorage.setItem(KEY.tasks,JSON.stringify(tasks||[]));",
      "function saveAll(){\n  localStorage.setItem(\"lifehub_updatedAt\", String(Date.now()));\n  localStorage.setItem(KEY.tasks,JSON.stringify(tasks||[]));"
    );
    html=html.replace(
      "localStorage.setItem(KEY.widgets,JSON.stringify(widgets||[]));\n}",
      "localStorage.setItem(KEY.widgets,JSON.stringify(widgets||[]));\n  if (window.queueCloudSave) window.queueCloudSave();\n}"
    );
    html=html.replace(
      "syncICloudCalendar(true);",
      "syncICloudCalendar(true);\nif (window.pullCloud) window.pullCloud();"
    );
    html=html.replace(
      "</body>",
      "<script src=\"/lifehub-cloud.js\"><\/script></body>"
    );
    document.open();
    document.write(html);
    document.close();
    }).catch(function(){ load(i+1); });
  }
  load(0);
})();
</script>
</body>
</html>
