<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeHub</title>
</head>
<body>
<script>
(function(){
  // Keep calendar links saved in LifeHub settings; never overwrite them on page load.
  var SRCS=[
    "https://cdn.jsdelivr.net/gh/kunkelino/omniaihub.net@41451a1d8dcd59ae570824ee3277031194ef3959/lifehub.html",
    "https://raw.githubusercontent.com/kunkelino/omniaihub.net/41451a1d8dcd59ae570824ee3277031194ef3959/lifehub.html"
  ];
  function load(i){
    if(i>=SRCS.length){ document.body.textContent="Could not load LifeHub. Refresh."; return; }
    fetch(SRCS[i],{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error(); return r.text(); }).then(function(html){
    html=html.replace("let tasks=","var tasks=");
    html=html.replace(
      '<input id="googleIcsUrl" type="hidden">\\n    <input id="appleIcsUrl" type="hidden">\\n    <input id="appleIcsHomeUrl" type="hidden">',
      '<div style="margin-top:14px"><label for="appleIcsHomeUrl" style="display:block;margin:8px 0 4px">Apple Home Calendar iCloud link</label><input id="appleIcsHomeUrl" type="url" placeholder="Paste iCloud Calendar link here" style="width:100%;padding:10px;border:1px solid #bbb;border-radius:8px"><button class="primary" onclick="saveCalendarFeeds();syncICloudCalendar(false)" style="margin-top:8px">Save Apple Link</button></div><input id="googleIcsUrl" type="hidden"><input id="appleIcsUrl" type="hidden">'
    );
    html=html.replace(
      '<button class="action-apple" onclick="syncICloudCalendar()">☁️ Sync Apple</button>',
      '<button class="action-apple" onclick="syncICloudCalendar()">☁️ Sync Apple</button>'
    );
    html=html.replace("let buy=","var buy=");
    html=html.replace("let events=","var events=");
    html=html.replace("let notes=","var notes=");
    html=html.replace(
      "function saveAll(){\n  localStorage.setItem(KEY.tasks,JSON.stringify(tasks||[]));",
      "function saveAll(){\n  localStorage.setItem(\"lifehub_updatedAt\", String(Date.now()));\n  localStorage.setItem(KEY.tasks,JSON.stringify(tasks||[]));"
    );
    html=html.replace(
      "localStorage.setItem(KEY.widgets,JSON.stringify(widgets||[]));\n}",
      "localStorage.setItem(KEY.widgets,JSON.stringify(widgets||[]));\n  if (window.queueCloudSave) window.queueCloudSave();\n}"
    );
    html=html.replace(
      "syncICloudCalendar(true);",
      "syncICloudCalendar(true);\nif (window.pullCloud) window.pullCloud();"
    );
    html=html.replace(
      "</body>",
      "<script src=\"/lifehub-cloud.js\"><\\/script></body>"
    );
    html=html.replace("</body>", "<script src=\"/copyright.js\"><\\/script></body>");
    document.open();
    document.write(html);
    document.close();
    }).catch(function(){ load(i+1); });
  }
  load(0);
})();
</script>
</body>
</html>
