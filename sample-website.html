<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sample Website</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#07040f;color:#e7c866;font-family:Cinzel,serif;min-height:100vh}.video-pane{width:100%;height:33.33vh;position:sticky;top:0;z-index:5;background:#000;overflow:hidden}.video-pane video{width:100%;height:100%;object-fit:cover;display:block}.page{max-width:980px;margin:0 auto;padding:28px 18px 64px;text-align:center;background:radial-gradient(circle at 50% 0%,#1a1030 0%,#07040f 62%)}h1{font-weight:500;font-size:clamp(3.2rem,12vw,6.6rem);letter-spacing:.16em;line-height:1;color:#e4c56a}.rule{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0 28px;letter-spacing:.08em;font-size:clamp(1rem,2.4vw,1.35rem);color:#e4c56a}.rule:before,.rule:after{content:"";width:54px;height:1px;background:#e4c56a}.rule span{font-size:.7em}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}.card{border:1px solid rgba(228,197,106,.45);border-radius:10px;padding:16px 10px 62px;background:rgba(8,6,16,.55);position:relative;min-height:100%}.card img{width:100%;height:180px;object-fit:contain;display:block;margin-bottom:8px}h2{font-size:clamp(.95rem,2.4vw,1.7rem);font-weight:500;margin-bottom:6px;min-height:2.4em}.notes{font-size:clamp(.68rem,1.5vw,.95rem);min-height:2.8em;margin-bottom:8px}.price{font-size:clamp(1.05rem,2.2vw,1.6rem)}button{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:transparent;color:#e4c56a;border:1px solid rgba(228,197,106,.75);border-radius:8px;padding:8px 18px;font-family:Cinzel,serif;letter-spacing:.16em;font-size:clamp(.68rem,1.5vw,.95rem);cursor:pointer;white-space:nowrap}button:disabled{opacity:.4}.stock{display:block;margin-top:8px;font-size:.72rem;letter-spacing:.06em;color:#b9a7d6}.order-box{margin-top:22px;border:1px solid rgba(228,197,106,.45);border-radius:10px;background:rgba(8,6,16,.55);padding:16px 18px 18px;text-align:left}.sub-row,.picked-line{display:flex;justify-content:space-between;gap:12px;letter-spacing:.08em;font-size:clamp(.85rem,2vw,1.05rem)}.picked-line{margin-top:8px;color:#e4c56a}.sub-row{margin-top:12px;font-size:clamp(1rem,2.2vw,1.25rem)}.pay-now{display:block;text-align:center;margin-top:16px;padding:12px 28px;border:1px solid #e4c56a;color:#07040f;background:#e4c56a;text-decoration:none;letter-spacing:.16em;border-radius:8px}.status{margin-top:10px;color:#cbb89a;font-size:.8rem;text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.card{padding-bottom:54px}.card img{height:110px}button{padding:7px 10px;bottom:12px}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="video-pane"><video id="club-video" src="sample-website.mp4?v=1" autoplay loop playsinline preload="auto"></video></div>
<div class="page">
<h1>HIM</h1><p class="rule"><span>◆</span> Nightclub Reserve <span>◆</span></p>
<main class="grid" id="products"></main>
<div class="order-box"><div id="picked">Select a cologne</div><div class="sub-row"><span>Items</span><span id="count">0</span></div><div class="sub-row"><span>Subtotal</span><span id="subtotal">$0.00</span></div><a class="pay-now" href="checkout.html" id="checkout">CHECKOUT</a><div class="status" id="status">Loading inventory…</div></div>
</div>
<script>
const video=document.getElementById("club-video");video.loop=true;video.playsInline=true;video.volume=1;
function playVideo(){const p=video.play();if(p&&p.catch)p.catch(()=>{});return p}function soundOn(){video.muted=false;video.volume=1;playVideo()}
const start=video.play();if(start&&start.catch)start.catch(()=>{video.muted=true;playVideo();document.addEventListener("pointerdown",soundOn,{once:true})});
video.addEventListener("canplay",()=>{if(video.paused)playVideo()});

let products=[];let cart=JSON.parse(localStorage.getItem("sampleCart")||"[]");
function save(){localStorage.setItem("sampleCart",JSON.stringify(cart))}
function qty(id){const x=cart.find(i=>i.id===id);return x?x.quantity:0}
function add(id){
 const p=products.find(x=>x.id===id);if(!p)return;
 const current=qty(id);if(current>=p.inventory){alert("That item is sold out.");return}
 const x=cart.find(i=>i.id===id);if(x)x.quantity++;else cart.push({id,quantity:1});save();render()
}
function render(){
 const grid=document.getElementById("products");grid.innerHTML="";let total=0,count=0;
 products.forEach(p=>{
  const q=qty(p.id);total+=p.price*q;count+=q;
  const card=document.createElement("article");card.className="card";
  card.innerHTML="<h2>"+p.name+"</h2><img src='"+p.image+"' alt='"+p.name+"'><p class='notes'>"+p.notes+"</p><p class='price'>$"+Number(p.price).toFixed(2)+"</p><span class='stock'>"+p.inventory+" in stock · "+q+" selected</span><button "+(q>=p.inventory?"disabled":"")+">SELECT</button>";
  card.querySelector("button").onclick=()=>add(p.id);grid.appendChild(card);
 });
 const picked=document.getElementById("picked");picked.innerHTML=cart.length?"":"Select a cologne";
 cart.forEach(i=>{const p=products.find(x=>x.id===i.id);if(!p)return;const line=document.createElement("div");line.className="picked-line";line.innerHTML="<span>"+p.name+" × "+i.quantity+"</span><span>$"+(p.price*i.quantity).toFixed(2)+"</span>";picked.appendChild(line)});
 document.getElementById("count").textContent=count;document.getElementById("subtotal").textContent="$"+total.toFixed(2);
 document.getElementById("checkout").style.pointerEvents=count?"auto":"none";document.getElementById("checkout").style.opacity=count?"1":".45";
}
async function init(){try{const r=await fetch("/api/store?action=inventory");if(!r.ok)throw new Error();const d=await r.json();products=d.products;document.getElementById("status").textContent="Inventory connected.";render()}catch(e){document.getElementById("status").textContent="Backend storage is not connected yet.";products=[{id:"noir-entree",name:"Noir Entree",price:195,inventory:15,image:"bottle-noir.jpg",notes:"Woody · Smoky · Magnetic"},{id:"velvet-vice",name:"Velvet Vice",price:195,inventory:15,image:"bottle-velvet.jpg",notes:"Spicy · Amber · Bold · Warm"},{id:"midnight-saint",name:"Midnight Saint",price:195,inventory:15,image:"bottle-saint.jpg",notes:"Aromatic · Leather · Smooth"}];render()}}
init();
</script>
<script src="/copyright.js"></script>
</body>
</html>
