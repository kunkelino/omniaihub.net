<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07040f;
      color: #e7c866;
      font-family: Cinzel, serif;
      min-height: 100vh;
    }
    .video-pane {
      width: 100%;
      height: 33.33vh;
      position: sticky;
      top: 0;
      z-index: 5;
      background: #000;
      overflow: hidden;
    }
    .video-pane video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 18px 64px;
      text-align: center;
      background: radial-gradient(circle at 50% 0%, #1a1030 0%, #07040f 62%);
    }
    h1 {
      font-weight: 500;
      font-size: clamp(3.2rem, 12vw, 6.6rem);
      letter-spacing: 0.16em;
      line-height: 1;
      color: #e4c56a;
    }
    .rule {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 10px 0 28px;
      letter-spacing: 0.08em;
      font-size: clamp(1rem, 2.4vw, 1.35rem);
      color: #e4c56a;
    }
    .rule::before, .rule::after {
      content: "";
      width: 54px;
      height: 1px;
      background: #e4c56a;
    }
    .rule span { font-size: 0.7em; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      align-items: stretch;
    }
    .card {
      border: 1px solid rgba(228, 197, 106, 0.45);
      border-radius: 10px;
      padding: 16px 10px 62px;
      background: rgba(8, 6, 16, 0.55);
      position: relative;
      min-height: 100%;
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      display: block;
      margin-bottom: 8px;
    }
    h2 { font-size: clamp(0.95rem, 2.4vw, 1.7rem); font-weight: 500; margin-bottom: 6px; min-height: 2.4em; }
    .notes { font-size: clamp(0.68rem, 1.5vw, 0.95rem); min-height: 2.8em; margin-bottom: 8px; }
    .price { font-size: clamp(1.05rem, 2.2vw, 1.6rem); }
    button {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      background: transparent;
      color: #e4c56a;
      border: 1px solid rgba(228, 197, 106, 0.75);
      border-radius: 8px;
      padding: 8px 18px;
      font-family: Cinzel, serif;
      letter-spacing: 0.16em;
      font-size: clamp(0.68rem, 1.5vw, 0.95rem);
      cursor: pointer;
      white-space: nowrap;
    }
    button:disabled { opacity: 0.4; }
    .stock { display: block; margin-top: 8px; font-size: 0.72rem; letter-spacing: 0.06em; color: #b9a7d6; }

    .order-box {
      margin-top: 22px;
      border: 1px solid rgba(228, 197, 106, 0.45);
      border-radius: 10px;
      background: rgba(8, 6, 16, 0.55);
      padding: 16px 18px 18px;
      text-align: left;
    }
    .sub-row, .picked-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      letter-spacing: 0.08em;
      font-size: clamp(0.85rem, 2vw, 1.05rem);
    }
    .picked-line { margin-top: 8px; color: #e4c56a; }
    .sub-row { margin-top: 12px; font-size: clamp(1rem, 2.2vw, 1.25rem); }
    .order-box .pay-now { display: block; text-align: center; margin-top: 16px; }
    .pay-now {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 28px;
      border: 1px solid #e4c56a;
      color: #07040f;
      background: #e4c56a;
      text-decoration: none;
      letter-spacing: 0.16em;
      border-radius: 8px;
    }
    @media (max-width: 700px) {
      .card { padding-bottom: 54px; }
      .card img { height: 110px; }
      button { padding: 7px 10px; bottom: 12px; }
    }
  </style>
</head>
<body>
  <div class="video-pane">
    <video id="club-video" src="sample-website.mp4?v=1" autoplay loop playsinline preload="auto"></video>
  </div>
  <div class="page">
    <h1>HIM</h1>
    <p class="rule"><span>◆</span> Nightclub Reserve <span>◆</span></p>
    <main class="grid">
      <article class="card">
        <h2>Noir Entree</h2>
        <img src="bottle-noir.jpg" alt="Noir Entree">
        <p class="notes">Woody · Smoky · Magnetic</p>
        <p class="price">$195</p>
        <button onclick="selectCologne(1)">SELECT</button>
      </article>
      <article class="card">
        <h2>Velvet Vice</h2>
        <img src="bottle-velvet.jpg" alt="Velvet Vice">
        <p class="notes">Spicy · Amber · Bold · Warm</p>
        <p class="price">$195</p>
        <button onclick="selectCologne(2)">SELECT</button>
      </article>
      <article class="card">
        <h2>Midnight Saint</h2>
        <img src="bottle-saint.jpg" alt="Midnight Saint">
        <p class="notes">Aromatic · Leather · Smooth</p>
        <p class="price">$195</p>
        <button onclick="selectCologne(3)">SELECT</button>
      </article>
    </main>
    <div class="order-box">
      <div id="picked">Select a cologne</div>
      <div class="sub-row"><span>Subtotal</span><span id="subtotal">$0</span></div>
      <a class="pay-now" href="pay.html">Pay Now</a>
    </div>
  </div>
  <script>
    var video = document.getElementById('club-video');
    video.loop = true;
    video.playsInline = true;
    video.volume = 1;
    video.addEventListener('ended', function() {
      video.currentTime = 0;
      playVideo();
    });
    function playVideo() {
      var p = video.play();
      if (p && p.catch) p.catch(function(){});
      return p;
    }
    function soundOn() {
      video.muted = false;
      video.volume = 1;
      playVideo();
    }
    var start = video.play();
    if (start && start.catch) {
      start.catch(function() {
        video.muted = true;
        playVideo();
        document.addEventListener('pointerdown', soundOn, { once: true });
      });
    }
    video.addEventListener('canplay', function() {
      if (video.paused) playVideo();
    });
    var names = {1:"Noir Entree", 2:"Velvet Vice", 3:"Midnight Saint"};
    var picked = [];
    function selectCologne(id) {
      picked.push({name: names[id], price: 195});
      var box = document.getElementById("picked");
      box.innerHTML = "";
      var total = 0;
      picked.forEach(function(item) {
        total += item.price;
        var line = document.createElement("div");
        line.className = "picked-line";
        line.innerHTML = "<span>" + item.name + "</span><span>$195</span>";
        box.appendChild(line);
      });
      document.getElementById("subtotal").textContent = "$" + total;
    }
  </script>
</body>
</html>
