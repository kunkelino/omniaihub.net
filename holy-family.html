<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MHIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07040f;
      color: #e7c866;
      font-family: Cinzel, serif;
      min-height: 100vh;
    }
    .video-pane {
      width: 100%;
      height: 33.33vh;
      position: sticky;
      top: 0;
      z-index: 5;
      background: #000;
      overflow: hidden;
    }
    .video-pane video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 18px 64px;
      text-align: center;
      background: radial-gradient(circle at 50% 0%, #1a1030 0%, #07040f 62%);
    }
    h1 {
      font-weight: 500;
      font-size: clamp(3.2rem, 12vw, 6.6rem);
      letter-spacing: 0.16em;
      line-height: 1;
      color: #e4c56a;
    }
    .rule {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 10px 0 28px;
      letter-spacing: 0.08em;
      font-size: clamp(1rem, 2.4vw, 1.35rem);
      color: #e4c56a;
    }
    .rule::before, .rule::after {
      content: "";
      width: 54px;
      height: 1px;
      background: #e4c56a;
    }
    .rule span { font-size: 0.7em; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .card {
      border: 1px solid rgba(228, 197, 106, 0.45);
      border-radius: 10px;
      padding: 16px 10px 18px;
      background: rgba(8, 6, 16, 0.55);
    }
    .card img {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 8px;
    }
    h2 { font-size: clamp(1rem, 2.5vw, 1.7rem); font-weight: 500; margin-bottom: 6px; }
    .notes { font-size: clamp(0.72rem, 1.6vw, 0.95rem); margin-bottom: 8px; }
    .price { font-size: clamp(1.1rem, 2.4vw, 1.6rem); margin-bottom: 14px; }
    button {
      background: transparent;
      color: #e4c56a;
      border: 1px solid rgba(228, 197, 106, 0.75);
      border-radius: 8px;
      padding: 8px 18px;
      font-family: Cinzel, serif;
      letter-spacing: 0.16em;
      font-size: clamp(0.72rem, 1.6vw, 0.95rem);
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; }
    .stock { display: block; margin-top: 8px; font-size: 0.72rem; letter-spacing: 0.06em; color: #b9a7d6; }
  </style>
</head>
<body>
  <div class="video-pane">
    <video id="club-video" autoplay loop playsinline src="him-loop.mp4?v=jazz"></video>
  </div>
  <div class="page">
    <h1>MHIM</h1>
    <p class="rule"><span>◆</span> Nightclub Reserve <span>◆</span></p>
    <main class="grid">
      <article class="card">
        <img src="bottle-noir.jpg" alt="Noir Entree">
        <h2>Noir Entree</h2>
        <p class="notes">Woody · Smoky · Magnetic</p>
        <p class="price">$195</p>
        <button onclick="selectCologne(1)">SELECT</button>
        <span class="stock" id="stock-1">9 Remaining</span>
      </article>
      <article class="card">
        <img src="bottle-velvet.jpg" alt="Velvet Vice">
        <h2>Velvet Vice</h2>
        <p class="notes">Spicy · Amber · Bold</p>
        <p class="price">$195</p>
        <button onclick="selectCologne(2)">SELECT</button>
        <span class="stock" id="stock-2">9 Remaining</span>
      </article>
      <article class="card">
        <img src="bottle-saint.jpg" alt="Midnight Saint">
        <h2>Midnight Saint</h2>
        <p class="notes">Aromatic · Leather · Smooth</p>
        <p class="price">$195</p>
        <button onclick="selectCologne(3)">SELECT</button>
        <span class="stock" id="stock-3">9 Remaining</span>
      </article>
    </main>
  </div>
  <script>
    const video = document.getElementById('club-video');
    video.muted = false;
    video.volume = 0.7;
    video.loop = true;
    function start() {
      video.muted = false;
      video.volume = 0.7;
      const p = video.play();
      if (p) p.catch(function(){});
    }
    start();
    video.addEventListener('loadeddata', start);
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) start(); });
    const inventory = {1:9, 2:9, 3:9};
    function selectCologne(id) {
      if (inventory[id] <= 0) return;
      inventory[id] = Math.max(0, inventory[id] - 2);
      const stock = document.getElementById('stock-' + id);
      const btn = stock.parentElement.querySelector('button');
      if (inventory[id] === 0) {
        stock.textContent = 'Sold Out';
        btn.disabled = true;
      } else {
        stock.textContent = inventory[id] + ' Remaining';
      }
    }
  </script>
</body>
</html>
