<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay Now</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f4f7fb;
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }
    .home-link {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 30;
      background: #fff;
      color: #312e81;
      font-weight: 700;
      text-decoration: none;
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .08);
    }
    .home-link:hover { background: #312e81; color: #fff; }
    .page { max-width: 520px; margin: 0 auto; padding: 78px 18px 40px; }
    h1 { font-size: 28px; color: #312e81; margin-bottom: 6px; }
    p { color: #6b7280; margin-bottom: 16px; }
    .cart {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .08);
      margin-bottom: 16px;
    }
    .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e5e7eb; font-weight: 700; }
    .total { display: flex; justify-content: space-between; margin-top: 10px; font-weight: 800; }
    .list { display: grid; gap: 12px; }
    a.opt {
      display: block;
      background: #4f46e5;
      color: #fff;
      text-decoration: none;
      text-align: center;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
    }
    a.opt:hover { background: #312e81; }
    .back { display: inline-block; margin-top: 16px; color: #312e81; font-weight: 700; }
  </style>
</head>
<body>
  <a class="home-link" href="index.html">← Portfolio</a>
  <div class="page">
    <h1>Pay Now</h1>
    <p>Choose a way to pay</p>
    <div class="cart" id="cartBox"></div>
    <div class="list">
      <a class="opt" href="https://www.paypal.com/us/digital-wallet/ways-to-pay/visa" target="_blank" rel="noopener">Visa</a>
      <a class="opt" href="https://www.paypal.com/us/digital-wallet/ways-to-pay/mastercard" target="_blank" rel="noopener">MasterCard</a>
      <a class="opt" href="https://venmo.com/" target="_blank" rel="noopener">Venmo</a>
      <a class="opt" href="https://www.paypal.com/" target="_blank" rel="noopener">PayPal</a>
    </div>
    <a class="back" href="sample-website.html">Back to shop</a>
  </div>
  <script>
    var cart = [];
    try { cart = JSON.parse(sessionStorage.getItem("sample_cart") || "[]"); } catch (e) { cart = []; }
    var box = document.getElementById("cartBox");
    if (!cart.length) {
      box.innerHTML = "<p>Cart is empty.</p>";
    } else {
      var total = 0;
      var html = "";
      cart.forEach(function(item) {
        total += item.price * item.qty;
        html += "<div class='row'><span>" + item.name + " × " + item.qty + "</span><span>$" + (item.price * item.qty) + "</span></div>";
      });
      html += "<div class='total'><span>Total</span><span>$" + total + "</span></div>";
      box.innerHTML = html;
    }
  </script>
</body>
</html>
