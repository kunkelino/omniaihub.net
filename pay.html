<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay Now</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { margin:0; background:#07040f; color:#e4c56a; font-family:Cinzel,serif; text-align:center; }
    h1 { margin:40px 0 8px; letter-spacing:0.14em; font-weight:500; }
    p { color:#cbb89a; }
    .list { max-width:420px; margin:28px auto; display:grid; gap:14px; padding:0 18px; }
    a.opt { display:block; border:1px solid rgba(228,197,106,.7); color:#e4c56a; text-decoration:none; padding:16px; border-radius:10px; letter-spacing:0.12em; }
    .back { display:inline-block; margin:18px; color:#cbb89a; }
  </style>
</head>
<body>
  <h1>Pay Now</h1>
  <p>Choose a way to pay</p>
  <div class="list">
    <a class="opt" href="https://www.paypal.com/us/digital-wallet/ways-to-pay/visa" target="_blank" rel="noopener">Visa</a>
    <a class="opt" href="https://www.paypal.com/us/digital-wallet/ways-to-pay/mastercard" target="_blank" rel="noopener">MasterCard</a>
    <a class="opt" href="https://venmo.com/" target="_blank" rel="noopener">Venmo</a>
    <a class="opt" href="https://www.paypal.com/" target="_blank" rel="noopener">PayPal</a>
  </div>
  <a class="back" href="sample-website.html">Back</a>
</body>
</html>
