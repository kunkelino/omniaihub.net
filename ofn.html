<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One From Now</title>
</head>
<body>
<script>
(function(){
  var SRCS=[
    "https://cdn.jsdelivr.net/gh/kunkelino/omniaihub.net@c9639ff5e7edfc4c0521cbc2cbbb41ed4b60158d/ofn.html",
    "https://raw.githubusercontent.com/kunkelino/omniaihub.net/c9639ff5e7edfc4c0521cbc2cbbb41ed4b60158d/ofn.html"
  ];
  function load(i){
    if(i>=SRCS.length){ document.body.textContent="Could not load One From Now. Refresh."; return; }
    fetch(SRCS[i],{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error(); return r.text(); }).then(function(html){
      html=html.replace('if(sessionStorage.getItem(KEY)==="1") openSite();','openSite();');
      html=html.replace('<div id="gate">','<div id="gate" class="ok">');
      html=html.replace("</body>", "<script src=\"/copyright.js\"></script></body>");
    document.open();
      document.write(html);
      document.close();
    }).catch(function(){ load(i+1); });
  }
  load(0);
})();
</script>
</body>
</html>
