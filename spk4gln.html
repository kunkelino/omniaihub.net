

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Speak4 - Two-Way Accessibility Video Call</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100dvh;
      background: #020f0c;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    /* Speak4 Fluid Responsive Frame */
    .app-viewport {
      width: 100%;
      max-width: 720px;
      height: 100dvh;
      background: #051a14;
      display: flex;
      flex-direction: column;
      position: relative;
      border-left: 1px solid #0d382c;
      border-right: 1px solid #0d382c;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    /* TOP HEADER */
    .top-header {
      padding: 12px 18px 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .header-actions {
      display: flex;
      gap: 8px;
    }
    .header-pill {
      background: rgba(13, 56, 44, 0.7);
      border: 1px solid #14533f;
      color: #34d399;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
    }
    /* =========================================
       MAIN SCREEN: USER 1 (AVATAR STAGE)
       ========================================= */
    .video-call-stage {
      flex: 1;
      position: relative;
      margin: 0 16px;
      border-radius: 18px;
      overflow: hidden;
      background: #082920;
      border: 1px solid #0f4435;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 220px;
    }
    #user1AvatarVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #user1SelfieImg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    /* Floating Real-Time Subtitle Banner (Shifted to clear the ASL box) */
    .live-caption-overlay {
      position: absolute;
      bottom: 14px;
      left: 140px; /* Positions text to the right of the ASL box */
      right: 14px;
      background: rgba(4, 26, 20, 0.92);
      border: 1px solid #2dd4bf;
      color: #2dd4bf;
      padding: 8px 14px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: left;
      display: none;
      z-index: 10;
      backdrop-filter: blur(4px);
      word-wrap: break-word;
    }
    /* =========================================
       TOP-RIGHT TALK BOX: USER 2 (CALLER)
       ========================================= */
    .user2-talk-box {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 115px;
      height: 145px;
      background: #020f0c;
      border: 2px solid #2dd4bf;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.6);
      z-index: 15;
    }
    #user2Video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .talk-box-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.65rem;
      background: rgba(4, 26, 20, 0.88);
      padding: 2px 0;
      color: #a7f3d0;
      font-weight: 700;
    }
    /* =========================================
       BOTTOM-LEFT TALK BOX: BLACK & WHITE ASL
       ========================================= */
    .asl-talk-box {
      position: absolute;
      bottom: 12px;
      left: 12px;
      width: 118px;
      height: 148px;
      background: #000000;
      border: 2px solid #a855f7;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.7);
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    #aslMotionContainer {
      width: 100%;
      height: 122px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      overflow: hidden;
    }
    #aslMotionImg {
      width: 90%;
      height: 90%;
      object-fit: contain;
      display: block;
      filter: grayscale(100%) contrast(120%);
    }
    .asl-box-label {
      width: 100%;
      height: 26px;
      line-height: 25px;
      text-align: center;
      font-size: 0.65rem;
      background: rgba(20, 5, 30, 0.95);
      color: #e9d5ff;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-top: 1px solid rgba(168, 85, 247, 0.4);
    }
    /* =========================================
       BOTTOM SECTION: TRANSCRIPT & CONTROLS
       ========================================= */
    .bottom-section {
      padding: 10px 16px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
    }
    .transcript-box {
      height: 125px;
      background: rgba(6, 32, 26, 0.85);
      border: 1px solid #0f4435;
      border-radius: 14px;
      padding: 10px 12px;
      overflow-y: auto;
      font-size: 0.85rem;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth;
    }
    .msg {
      padding: 6px 10px;
      border-radius: 8px;
      max-width: 90%;
      word-wrap: break-word;
    }
    .msg .sender-tag {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 2px;
      opacity: 0.85;
    }
    .msg.user1 {
      background: #0f4435;
      border-left: 3px solid #34d399;
      align-self: flex-start;
      color: #ecfdf5;
    }
    .msg.user1 .sender-tag {
      color: #34d399;
    }
    .msg.user2 {
      background: #0d3329;
      border-left: 3px solid #2dd4bf;
      align-self: flex-end;
      color: #ccfbf1;
    }
    .msg.user2.streaming {
      border-left-color: #f59e0b;
    }
    .msg.user2 .sender-tag {
      color: #2dd4bf;
    }
    .msg.system {
      background: transparent;
      color: #6ee7b7;
      font-size: 0.75rem;
      font-style: italic;
      align-self: center;
      padding: 2px 0;
    }
    /* Type Input Bar */
    .type-bar {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .type-bar input {
      flex: 1;
      padding: 12px 16px;
      background: #082920;
      border: 1px solid #14533f;
      border-radius: 24px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
    }
    .type-bar button {
      padding: 11px 18px;
      background: #10b981;
      border: none;
      border-radius: 24px;
      color: #020f0c;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .repeat-btn {
      padding: 11px 14px;
      background: rgba(13, 56, 44, 0.8);
      border: 1px solid #14533f;
      border-radius: 24px;
      color: #34d399;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    /* Bottom Action Buttons */
    .bottom-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .action-btn {
      flex: 1;
      padding: 13px 10px;
      border-radius: 24px;
      border: 1px solid #14533f;
      background: #082920;
      color: #a7f3d0;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .action-btn.active {
      background: #2dd4bf;
      color: #020f0c;
      border-color: #2dd4bf;
    }
  
#hubHomeBtn{position:fixed;top:8px;left:8px;z-index:9999;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.28);color:#111;text-decoration:none;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(0,0,0,.18);}
#hubHomeBtn svg{width:18px;height:18px;display:block;}
#hubHomeBtn:hover{background:rgba(255,255,255,.5);}
</style>
</head>
<body>

<a id="hubHomeBtn" href="/index.html" title="Home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M6 10.5V20h12v-9.5"/></svg></a>

  <div class="app-viewport">
    <div class="top-header">
      <div class="brand-title">Speak4</div>
      <div class="header-actions">
        <label class="header-pill" style="cursor:pointer;">
          📁 Load Video
          <input type="file" accept="video/*" style="display:none;" onchange="loadAvatarVideo(event)">
        </label>
        <button class="header-pill" onclick="resetCall()">🔄 Reset</button>
      </div>
    </div>

    <div class="video-call-stage">
      <video id="user1AvatarVideo" loop muted playsinline webkit-playsinline preload="auto">
        <source src="my_avatar.mp4" type="video/mp4" />
      </video>

      <img id="user1SelfieImg" alt="User 1 Selfie" />

      <div class="live-caption-overlay" id="captionOverlay">...</div>

      <div class="user2-talk-box">
        <video id="user2Video" autoplay playsinline webkit-playsinline muted></video>
        <div class="talk-box-label">User 2</div>
      </div>

      <div class="asl-talk-box">
        <div id="aslMotionContainer">
          <img id="aslMotionImg" src="https://www.lifeprint.com/asl101/fingerspelling/abc-gifs/a.gif" alt="ASL Sign" />
        </div>
        <div class="asl-box-label" id="aslBoxLabel">ASL Ready</div>
      </div>
    </div>

    <canvas id="snapshotCanvas" style="display:none;"></canvas>

    <div class="bottom-section">
      <div class="transcript-box" id="transcriptLog">
        <div class="msg system">Ready. Spoken words will render as black & white ASL hand signs.</div>
      </div>

      <div class="type-bar">
        <input type="text" id="user1Input" placeholder="Type here to speak..." onkeypress="handleKey(event)" />
        <button onclick="submitUser1Text()">Say It</button>
        <button class="repeat-btn" title="Repeat last phrase" onclick="repeatLastSpoken()">🔁</button>
      </div>

      <div class="bottom-actions">
        <button class="action-btn" onclick="takeUser1Selfie()">
          📷 <span>User 1 selfie</span>
        </button>

        <button class="action-btn" id="user2LiveBtn" onclick="toggleUser2Call()">
          🎙️ <span id="user2BtnText">User 2 live</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const transcriptLog = document.getElementById("transcriptLog");
    const captionOverlay = document.getElementById("captionOverlay");
    const user1Video = document.getElementById("user1AvatarVideo");
    const user1SelfieImg = document.getElementById("user1SelfieImg");
    const user2Video = document.getElementById("user2Video");
    const user2LiveBtn = document.getElementById("user2LiveBtn");
    const user2BtnText = document.getElementById("user2BtnText");
    const user1Input = document.getElementById("user1Input");
    const canvas = document.getElementById("snapshotCanvas");
    const aslMotionImg = document.getElementById("aslMotionImg");
    const aslBoxLabel = document.getElementById("aslBoxLabel");

    let isCallActive = false;
    let cameraStream = null;
    let recognition = null;
    let activeStreamBubble = null;
    let lastSpokenText = "";

    const IDLE_HAND_SRC = "https://www.lifeprint.com/asl101/fingerspelling/abc-gifs/a.gif";

    // --- ASL MOTION QUEUE ---
    let signMotionQueue = [];
    let isMotionSigning = false;

    function queueSpeechToASLMotion(spokenText) {
      const clean = spokenText.toLowerCase().trim();
      const words = clean.replace(/[^a-z0-9\s]/g, "").split(/\s+/).filter(w => w.length > 0);

      words.forEach(word => {
        for (let char of word) {
          if (char >= 'a' && char <= 'z') {
            signMotionQueue.push({
              label: `${word} (${char.toUpperCase()})`,
              src: `https://www.lifeprint.com/asl101/fingerspelling/abc-gifs/${char}.gif`,
              duration: 460
            });
          }
        }
      });

      if (!isMotionSigning) {
        processNextMotionSign();
      }
    }

    function processNextMotionSign() {
      if (signMotionQueue.length === 0) {
        isMotionSigning = false;
        aslBoxLabel.innerText = "ASL Ready";
        aslMotionImg.src = IDLE_HAND_SRC;
        return;
      }

      isMotionSigning = true;
      const current = signMotionQueue.shift();

      aslBoxLabel.innerText = current.label;
      aslMotionImg.src = current.src;

      setTimeout(processNextMotionSign, current.duration);
    }

    function loadAvatarVideo(e) {
      const file = e.target.files[0];
      if (file) {
        user1SelfieImg.style.display = "none";
        user1Video.style.display = "block";
        user1Video.src = URL.createObjectURL(file);
        user1Video.muted = true;
        user1Video.play().then(() => user1Video.pause());
      }
    }

    // --- USER 2 LIVE CALL WITH IOS MIC UNLOCK ---
    async function toggleUser2Call() {
      if (!isCallActive) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 } },
            audio: false 
          });

          user2Video.srcObject = cameraStream;
          user2Video.setAttribute('playsinline', '');
          user2Video.setAttribute('webkit-playsinline', '');
          await user2Video.play();

          isCallActive = true;
          user2LiveBtn.classList.add("active");
          user2BtnText.innerText = "End User 2";
          addMessage("User 2 active. Listening to speech...", "system");

          startSpeechEngine();

        } catch (err) {
          alert("Camera access note: " + err.message);
        }
      } else {
        if (cameraStream) {
          cameraStream.getTracks().forEach(t => t.stop());
          cameraStream = null;
        }
        user2Video.srcObject = null;
        if (recognition) {
          try { recognition.stop(); } catch(e) {}
          recognition = null;
        }

        isCallActive = false;
        user2LiveBtn.classList.remove("active");
        user2BtnText.innerText = "User 2 live";
        captionOverlay.style.display = "none";
        activeStreamBubble = null;
        signMotionQueue = [];
        isMotionSigning = false;
        aslBoxLabel.innerText = "ASL Ready";
        aslMotionImg.src = IDLE_HAND_SRC;
        addMessage("User 2 call ended.", "system");
      }
    }

    function startSpeechEngine() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        addMessage("Speech Recognition is not supported in this browser. Use Safari or Chrome.", "system");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onresult = (event) => {
        let interim = '';
        let final = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            final += event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }

        const liveText = (final || interim).trim();
        if (liveText) {
          captionOverlay.innerText = liveText;
          captionOverlay.style.display = "block";

          if (!activeStreamBubble) {
            activeStreamBubble = document.createElement("div");
            activeStreamBubble.className = "msg user2 streaming";
            activeStreamBubble.innerHTML = `<div class="sender-tag">User 2 (Speaking...)</div><span class="bubble-text"></span>`;
            transcriptLog.appendChild(activeStreamBubble);
          }
          const textSpan = activeStreamBubble.querySelector(".bubble-text");
          if (textSpan) textSpan.innerText = liveText;
          transcriptLog.scrollTop = transcriptLog.scrollHeight;
        }

        if (final.trim()) {
          if (activeStreamBubble) {
            activeStreamBubble.classList.remove("streaming");
            const tag = activeStreamBubble.querySelector(".sender-tag");
            if (tag) tag.innerText = "User 2 (Spoken)";
            const textSpan = activeStreamBubble.querySelector(".bubble-text");
            if (textSpan) textSpan.innerText = final.trim();
            activeStreamBubble = null;
          } else {
            addMessage(final.trim(), "user2", "User 2 (Spoken)");
          }
          transcriptLog.scrollTop = transcriptLog.scrollHeight;

          queueSpeechToASLMotion(final.trim());
        }
      };

      recognition.onerror = (event) => {
        console.warn("Speech notice:", event.error);
      };

      recognition.onend = () => {
        if (isCallActive) {
          try { recognition.start(); } catch(e) {}
        }
      };

      try {
        recognition.start();
      } catch (err) {
        console.error("Speech start issue:", err);
      }
    }

    function takeUser1Selfie() {
      if (!cameraStream) {
        alert("Please tap 'User 2 live' first to turn on the camera!");
        return;
      }
      canvas.width = user2Video.videoWidth || 320;
      canvas.height = user2Video.videoHeight || 240;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(user2Video, 0, 0, canvas.width, canvas.height);

      user1SelfieImg.src = canvas.toDataURL("image/png");
      user1Video.style.display = "none";
      user1SelfieImg.style.display = "block";
      addMessage("User 1 updated avatar photo.", "system");
    }

    // --- SYNCHRONIZED TTS WITH USER 1 AVATAR & KEYBOARD DISMISSAL ---
    function submitUser1Text() {
      const text = user1Input.value.trim();
      if (!text) return;

      // Dismiss the iPhone keyboard immediately
      user1Input.blur();

      lastSpokenText = text;
      activeStreamBubble = null;
      addMessage(text, "user1", "You (User 1)");
      user1Input.value = "";

      speakText(text);
      queueSpeechToASLMotion(text);
    }

    function repeatLastSpoken() {
      if (!lastSpokenText) return;
      user1Input.blur();
      addMessage(lastSpokenText, "user1", "You (User 1 - Repeated)");
      speakText(lastSpokenText);
      queueSpeechToASLMotion(lastSpokenText);
    }

    function speakText(text) {
      if (user1Video.style.display !== "none") {
        user1Video.muted = true;
        user1Video.currentTime = 0;
        user1Video.play().catch(e => console.log("Video note:", e));
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.onend = () => {
          if (user1Video.style.display !== "none") {
            user1Video.pause();
          }
        };
        window.speechSynthesis.speak(utterance);
      }
    }

    function handleKey(e) {
      if (e.key === "Enter") submitUser1Text();
    }

    function addMessage(text, type, senderLabel = "") {
      const div = document.createElement("div");
      div.className = `msg ${type}`;
      if (senderLabel) {
        div.innerHTML = `<div class="sender-tag">${senderLabel}</div>${text}`;
      } else {
        div.innerText = text;
      }
      transcriptLog.appendChild(div);
      transcriptLog.scrollTop = transcriptLog.scrollHeight;
    }

    function resetCall() {
      location.reload();
    }
  </script>
</body>
</html>
